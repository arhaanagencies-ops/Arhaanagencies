<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<script>
/* Talks to the Arhaan Apps Script server without Google sign-in (works on phones with several Google accounts). */
(function () {
  var URL_ = window.ARHAAN_API_URL || '';
  /* Read-only calls are safe to repeat, so a dropped connection is retried quietly. Anything that saves is never repeated automatically. */
  var SAFE = /^(get|list|find|search|ping|runReport|loginAppUser|shopPublicInfo|shopBoot|shopPlan|shopOrders|shopInvoice|shopNote|shopDues|shopMyFeedback|shopLogin|d2c(Dashboard|ListOrders|GetOrder|ListPayments|Dues|ListCustomers|GetCustomer|ListCommunities|GetSettings|Print|DeliveryList|ListFeedback))/;
  function shown(msg) { var e = new Error(msg); e.shown = true; return e; }
  function once(fn, args) {
    var ctl = typeof AbortController === 'function' ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 100000) : 0;
    return fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
      .then(function (r) { clearTimeout(timer); if (!r.ok) { var e = new Error('Server error ' + r.status); e.status = r.status; throw e; } return r.text(); })
      .then(function (t) { try { return JSON.parse(t); } catch (e) { var x = new Error('answer'); x.notJson = true; throw x; } }, function (e) { clearTimeout(timer); throw e; });
  }
  function post(fn, args) {
    if (!/^https?:\/\//.test(URL_)) return Promise.reject(shown('App is not connected yet: put the web-app /exec link in config.js.'));
    var real = (fn === 'callWithSession' || fn === 'callShop') ? String(args[0] || '') : fn;   // the method the page really asks for
    var safe = SAFE.test(real), tries = safe ? 3 : 1, n = 0;
    function go() {
      n++;
      return once(fn, args).catch(function (e) {
        if (e.notJson) throw shown('The server did not answer correctly. Check that the web app is deployed with access "Anyone".');
        if (safe && n < tries && !(e.status && e.status < 500 && e.status !== 429)) return new Promise(function (res) { setTimeout(res, 900 * n); }).then(go);
        if (typeof navigator !== 'undefined' && navigator.onLine === false) throw shown('No internet connection. Please check your network and try again.');
        throw shown(safe ? 'The server is busy right now. Please try again in a few seconds.' : 'The connection dropped. Your last action may or may not have been saved – please check the list before trying again.');
      });
    }
    return go();
  }
  function make(ok, fail) {
    return new Proxy({}, { get: function (t, name) {
      if (name === 'withSuccessHandler') return function (f) { return make(f, fail); };
      if (name === 'withFailureHandler') return function (f) { return make(ok, f); };
      return function () {
        var args = [].slice.call(arguments);
        post(name, args).then(function (r) { if (r.error) { if (fail) fail(new Error(r.error)); } else if (ok) ok(r.result); },
          function (e) { if (fail) fail(new Error(e && e.shown ? e.message : 'Cannot reach the server – check the internet and try again.')); });
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink-2:#3A4766; --muted:#6B7590; --line:#E2E6EE; --line-2:#EEF1F6;
  --paper:#F4F6F9; --surface:#FFFFFF; --blue:#1F4FD1; --blue-2:#E8EEFC; --blue-ink:#163A9E;
  --amber:#D9920F; --amber-2:#FDF3E0; --green:#1E8E5A; --green-2:#E5F4EC; --red:#C2412D; --red-2:#FBEAE6;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --header-h:58px; --strip-h:40px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hidden{display:none!important}
:focus-visible{outline:3px solid rgba(31,79,209,.35);outline-offset:2px}
@media (max-width:480px){.route .stop{font-size:10.5px}.route .stop i{width:18px;height:18px}.route .stop::before{top:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
.login-card{width:min(400px,100%);background:var(--surface);border-radius:var(--r-l);padding:28px 24px}
.login-mark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-mark .logo{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.login-mark b{display:block;font-size:19px}
.login-mark span{color:var(--muted);font-size:13px}
.login .route{display:flex;align-items:center;gap:6px;margin:0 0 22px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.login .route i{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}

/* ---------- shell ---------- */
.header{position:sticky;top:0;z-index:30;height:var(--header-h);background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px}
.header .logo{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.header .logo img{width:100%;height:100%;object-fit:cover}
.header .who{min-width:0;flex:1}
.header .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .who span{display:block;font-size:12px;color:#B9C3DB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.hbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;line-height:18px;padding:0 4px}
.clock{font-family:var(--font-num);font-size:13px;color:#B9C3DB;white-space:nowrap}
.strip{position:sticky;top:var(--header-h);z-index:25;height:var(--strip-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px}
.strip label{color:var(--muted);white-space:nowrap}
.strip select{width:auto;min-height:0;font-size:14px;border:0;background:var(--blue-2);color:var(--blue-ink);font:inherit;font-weight:600;border-radius:8px;padding:5px 8px;max-width:60vw}
.strip .busy{margin-left:auto;display:none;align-items:center;gap:6px;color:var(--blue-ink);background:var(--blue-2);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.strip .busy.on{display:inline-flex}
.spin{width:12px;height:12px;border:2px solid rgba(31,79,209,.25);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.layout{display:flex;min-height:calc(100vh - var(--header-h) - var(--strip-h))}
.side{display:none}
.main{flex:1;min-width:0;padding:14px 12px 96px;max-width:1100px;margin:0 auto;width:100%}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom button{flex:1;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px}
.bottom button svg{width:22px;height:22px}
.bottom button.on{color:var(--blue);font-weight:600}
@media (min-width:900px){
  .bottom{display:none}
  .side{display:block;width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:calc(var(--header-h) + var(--strip-h));height:calc(100vh - var(--header-h) - var(--strip-h));overflow:auto}
  .main{padding:20px 24px 40px}
  .hide-desk{display:none!important}
}
@media (max-width:899px){.hide-mob{display:none!important}}
.nav-group{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;font:inherit;color:var(--ink-2);padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav-item:hover{background:var(--paper)}
.nav-item.on{background:var(--blue-2);color:var(--blue-ink);font-weight:600}
.nav-item.on svg{color:var(--blue)}
.nav-item .count{margin-left:auto;background:var(--amber-2);color:#8A5A00;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px}

/* drawer (mobile "More") */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(20,33,61,.45)}
.drawer .panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:10px 8px calc(16px + env(safe-area-inset-bottom))}
.drawer .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 6px}

/* ---------- page ---------- */
.page-head{display:flex;align-items:flex-start;gap:10px;margin:2px 0 14px}
.page-head .t{flex:1;min-width:0}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:18px;height:18px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;margin-bottom:12px}
.section > h3{margin-bottom:10px}
.section-head{display:flex;align-items:center;gap:4px 8px;margin-bottom:10px;flex-wrap:wrap}
.section-head h3{white-space:nowrap}
.section-head h3{flex:1}
.flat{background:transparent;border:0;padding:0}

/* KPI tiles: left rule encodes meaning */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink-2);border-radius:var(--r-m);padding:10px 12px;cursor:default;text-align:left;font:inherit;color:inherit;width:100%}
button.kpi{cursor:pointer}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-num);font-size:23px;font-weight:600;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.sales{border-left-color:var(--green)} .kpi.order{border-left-color:var(--blue)} .kpi.cash{border-left-color:#2B8FA3} .kpi.due{border-left-color:var(--red)} .kpi.warn{border-left-color:var(--amber)}

/* attention list */
.attn{display:flex;flex-direction:column}
.attn button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line-2);padding:11px 2px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.attn button:last-child{border-bottom:0}
.attn .n{font-family:var(--font-num);font-weight:600;font-size:18px;min-width:40px;height:34px;border-radius:9px;background:var(--amber-2);color:#8A5A00;display:grid;place-items:center;padding:0 6px}
.attn .x{flex:1}
.attn .x small{display:block;color:var(--muted)}

/* rows (lists) */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r b{font-family:var(--font-num);font-weight:600;display:block}
.row.static{cursor:default}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* status chips */
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.blue{background:var(--blue-2);color:var(--blue-ink)} .chip.green{background:var(--green-2);color:#13603C}
.chip.amber{background:var(--amber-2);color:#8A5A00} .chip.red{background:var(--red-2);color:#8E2A1B}

/* the order route: the one memorable element */
.route{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto;padding-bottom:4px}
.route .stop{flex:1;min-width:0;position:relative;text-align:center;font-size:11.5px;color:var(--muted)}
.route .stop::before{content:'';position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--line)}
.route .stop:first-child::before{display:none}
.route .stop i{position:relative;z-index:1;display:block;width:21px;height:21px;margin:0 auto 4px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.route .stop.done{color:var(--ink-2)}
.route .stop.done::before{background:var(--blue)}
.route .stop.done i{background:var(--blue);border-color:var(--blue)}
.route .stop.now{color:var(--blue-ink);font-weight:700}
.route .stop.now::before{background:var(--blue)}
.route .stop.now i{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-2)}
.route .stop.warn i{border-color:var(--amber);background:var(--amber)}
.route .stop.warn{color:#8A5A00;font-weight:700}
.route .stop.bad i{border-color:var(--red);background:var(--red)}
.route .stop.bad{color:var(--red);font-weight:700}
.mini-route{display:flex;gap:3px;margin-top:5px}
.mini-route i{height:4px;flex:1;border-radius:3px;background:var(--line)}
.mini-route i.d{background:var(--blue)} .mini-route i.w{background:var(--amber)} .mini-route i.b{background:var(--red)}

/* forms */
.form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}}
.grid3{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field > span em{font-style:normal;color:var(--red)}
.field small{color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid #CFD5E1;border-radius:var(--r-s);padding:10px 11px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,79,209,.15)}
input[readonly]{background:var(--paper)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:5px;border:1px solid #CFD5E1;border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}
.days input{width:16px;height:16px;min-height:0}
.days label:has(input:checked){background:var(--blue-2);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;border:1px solid transparent;min-height:44px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{background:var(--blue-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:#CFD5E1}
.btn.ghost:hover{background:var(--paper)}
.btn.quiet{background:var(--blue-2);color:var(--blue-ink)}
.btn.danger{background:var(--surface);color:var(--red);border-color:#E9B9AF}
.btn.ok{background:var(--green)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.sticky-actions{position:sticky;bottom:72px;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:10px 0 4px;display:flex;gap:8px;z-index:5}
@media (min-width:900px){.sticky-actions{bottom:0}}
.note{border-radius:var(--r-m);padding:10px 12px;font-size:14px;background:var(--blue-2);color:var(--blue-ink)}
.note.warn{background:var(--amber-2);color:#7A4F00}
.note.bad{background:var(--red-2);color:#8E2A1B}
.note.good{background:var(--green-2);color:#13603C}
.tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:none;border:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:9px;color:var(--ink-2);cursor:pointer}
.tabs{scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{scroll-snap-align:center}
@media (max-width:480px){.tabs button{flex:0 0 auto;font-size:13px;padding:8px 11px}.page-head h1{font-size:21px}.row .m b{overflow-wrap:anywhere}.filters select,.filters input{min-width:0;width:100%}.actions.end .btn,.actions .btn.sm{white-space:nowrap}}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media (min-width:800px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters .wide{grid-column:1/-1}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:13px;width:18px;height:18px;color:var(--muted)}

/* order lines */
.line{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.line .top{display:flex;gap:8px;align-items:flex-start}
.line .top b{flex:1}
.line .meta{font-size:13px;color:var(--muted)}
.line.low{border-color:#F0C98A;background:#FFFBF2}
.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.total-bar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:var(--r-m);padding:12px 14px;margin:10px 0}
.total-bar .v{font-family:var(--font-num);font-size:22px;font-weight:600;margin-left:auto}
.picker{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.picker .row{padding:10px 12px}
.picker .row.sel{background:var(--blue-2)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{min-height:50px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:14px;color:#A3ABBF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;cursor:not-allowed}
.cal button small{font-size:9.5px;line-height:1.1}
.cal button.ok{background:var(--surface);color:var(--ink);border-color:#B9CBF5;cursor:pointer;font-weight:600}
.cal button.ok small{color:var(--green)}
.cal button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.cal button.sel small{color:#DCE5FF}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{flex:1;text-align:center}

/* tables (desktop-friendly, scroll on mobile) */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-m)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--paper)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--font-num)}
.tbl tr:last-child td{border-bottom:0}
.tbl input{min-height:36px;padding:6px 8px;font-size:15px;width:90px}
.tbl select{min-height:36px;padding:6px 8px;font-size:14px}

/* timeline */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:4px 0 10px}
.tl div::before{content:'';position:absolute;left:-17px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.tl b{font-weight:600}
.tl small{display:block;color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* modal sheet */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,33,61,.45)}
.modal.open{display:flex}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:var(--r-l)}}
.modal .sheet h3{margin-bottom:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);z-index:80;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(20,33,61,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.bad{background:var(--red)}
.toast.good{background:#13603C}
@media (min-width:900px){.toast{bottom:28px}}
.photo-in{display:flex;align-items:center;gap:10px;border:1px dashed #B9C3DB;border-radius:var(--r-s);padding:10px;background:var(--paper)}
.photo-in input{border:0;padding:0;min-height:0;background:transparent;font-size:14px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--blue);cursor:pointer;text-decoration:underline}

/* ---------- GST documents (screen preview + print) ---------- */
#printArea{display:none}
.pthumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;margin-right:10px;background:var(--line-2)}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.doc{font-family:Arial,Helvetica,sans-serif;font-size:8.6pt;line-height:1.3;color:#000;background:#fff;padding:2mm 3mm;width:194mm;box-sizing:border-box}
.doc .doc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.5mm}
.doc .doc-title{font-size:12pt;font-weight:700;letter-spacing:.06em}
.doc .doc-copy{font-size:7.5pt}
.doc .doc-seller{font-size:11pt;font-weight:700}
.doc .doc-seller span{font-size:8.6pt;font-weight:400}
.doc table{width:100%;border-collapse:collapse}
.doc .dt > tbody > tr > td,.doc .dt > tr > td{border:.6pt solid #222;padding:1.2mm 1.6mm;vertical-align:top}
.doc .di{margin-top:1.5mm}
.doc .di th,.doc .di td{border:.6pt solid #222;padding:.9mm 1.2mm;text-align:left}
.doc .di th{background:#eee;font-weight:700}
.doc .di tr.tot td{font-weight:700;background:#f5f5f5}
.doc .dm td{border:0;padding:.3mm 0}
.doc .dm td:first-child{color:#333;padding-right:2mm;white-space:nowrap}
.doc .dm tr.grand td{font-weight:700;font-size:10pt;border-top:.6pt solid #222;padding-top:.8mm}
.doc .dx th,.doc .dx td{border:.6pt solid #888;padding:.5mm 1mm}
.doc .n,.doc .di th.n,.doc .di td.n,.doc .dx th.n,.doc .dx td.n{text-align:right;white-space:nowrap}
.doc .doc-words{margin-top:1.2mm;font-weight:700}
.doc .doc-terms{font-size:7pt}
.doc .doc-sign{text-align:right}
.doc .doc-foot{font-size:6.5pt;color:#444;margin-top:1mm;text-align:right}
.doc-cut{border-top:1px dashed #999;margin:3mm 0 0;font-size:6.5pt;color:#999;text-align:center;width:194mm}
@media print {
  html,body{background:#fff!important}
  body > *:not(#printArea):not(style):not(script){display:none!important}
  #printArea{display:block!important}
  .doc{padding:0}
}
/* ---------- V7.3 brand logo ---------- */
.header .logo img,.login-mark .logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.login-mark .brand-logo{background:#fff;border:1px solid var(--line);width:60px;height:60px;overflow:hidden;flex:none}
.doc .doc-logo{float:left;height:38px;width:auto;margin:0 8px 2px 0}
/* ---------- V7.2 home delivery ---------- */
.seg{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:10px 6px;border-radius:9px;color:var(--ink-2);cursor:pointer;min-height:44px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:44px;min-height:44px;border:0;background:var(--line-2);font-size:20px;font-weight:600;color:var(--ink);cursor:pointer}
.stepper input{width:56px;border:0;text-align:center;font-family:var(--font-num);font-size:17px;font-weight:600;min-height:44px;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qr-box{display:inline-block;width:min(240px,70vw);padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-box svg{width:100%;height:auto;display:block}
.hbtn.spinning svg{animation:hspin .8s linear}@keyframes hspin{to{transform:rotate(360deg)}}
</style>

</head>
<body>
<div id="login" class="login">
  <form class="login-card" onsubmit="event.preventDefault();doLogin()">
    <div class="login-mark"><div class="logo brand-logo" id="loginLogo">AA</div><div><b>Arhaan Agencies</b><span>Distribution management</span></div></div>
    <div class="route"><i></i>Order<i></i>Supply<i></i>Invoice<i></i>Dispatch<i></i>Delivery<i></i>Collection</div>
    <div class="form">
      <label class="field"><span>User ID, mobile or email</span><input id="lu" autocomplete="username" autocapitalize="off" required></label>
      <label class="field"><span>Password</span><input id="lp" type="password" autocomplete="current-password" required></label>
      <label class="check"><input type="checkbox" onchange="$('lp').type=this.checked?'text':'password'"> Show password</label>
      <button class="btn block" id="loginBtn" type="submit">Sign in</button>
      <div id="loginMsg" class="small muted"></div>
    </div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="header">
    <div class="logo" id="hLogo">AA</div>
    <div class="who"><b id="hCompany">Arhaan Agencies</b><span id="hUser"></span></div>
    <span class="clock hide-mob" id="hClock"></span>
    <button class="hbtn" id="hRefresh" onclick="hardRefresh(this)" aria-label="Refresh this page" title="Refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
    <button class="hbtn" onclick="go('notifications')" aria-label="Notifications"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot hidden" id="hUnread">0</span></button>
    <button class="hbtn hide-mob" onclick="go('profile')">Profile</button>
    <button class="hbtn" onclick="doLogout()">Logout</button>
  </header>
  <div class="strip">
    <label for="companySel">Current company</label>
    <select id="companySel" onchange="switchCompany(this.value)"></select>
    <span class="busy" id="busy"><span class="spin"></span><span id="busyText">Loading…</span></span>
  </div>
  <div class="layout">
    <nav class="side" id="side"></nav>
    <main class="main" id="main"></main>
  </div>
  <nav class="bottom" id="bottom"></nav>
</div>

<div class="drawer" id="drawer"><div class="scrim" onclick="closeDrawer()"></div><div class="panel"><div class="grab"></div><div id="drawerNav"></div></div></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<style id="pageStyle">@page { size: A4 portrait; margin: 8mm; }</style>

<script>
/* =====================================================================

   The browser only renders. Every rule is validated again on the server.

var S = { token: '', boot: null, view: 'home', params: {}, stack: [], busy: 0, cache: {} };

function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function attr(v) { return esc(v); }
function js(v) { return esc(JSON.stringify(v == null ? '' : v)); }
function money(v) { var n = Number(v || 0); return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money0(v) { var n = Number(v || 0); return '₹' + n.toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function num(v) { return Number(v || 0).toLocaleString('en-IN'); }
function cap(v) { v = String(v || '').replace(/_/g, ' ').toLowerCase(); return v.charAt(0).toUpperCase() + v.slice(1); }
function today() { return S.boot ? S.boot.today : new Date().toISOString().slice(0, 10); }
function addDays(key, n) { var d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function monthStart(key) { return String(key || today()).slice(0, 8) + '01'; }
function fdate(v) {
  var s = String(v || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return v ? esc(v) : '–';
  var d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}
function fdatetime(v) { var s = String(v || ''); return s.length > 10 ? fdate(s) + ' ' + s.slice(11, 16) : fdate(s); }
function can(c) { return !!(S.boot && S.boot.caps && S.boot.caps[c]); }
function group() { return S.boot ? S.boot.user.role_group : ''; }
/* V7.7 free WhatsApp click-to-chat (wa.me) */
function waLink(phone, text) { var p = String(phone || '').replace(/\D/g, ''); if (p.length === 10) p = '91' + p; return 'https://wa.me/' + p + (text ? '?text=' + encodeURIComponent(text) : ''); }
function isAdmin() { return group() === 'MANAGEMENT'; }
function isSales() { return group() === 'SALES'; }
function L(name) { return (S.boot && S.boot.lists && S.boot.lists[name]) || []; }
function opts(list, selected, placeholder, valueKey, labelKey) {
  var h = placeholder !== undefined ? '<option value="">' + esc(placeholder) + '</option>' : '';
  (list || []).forEach(function (x) {
    var v = typeof x === 'object' ? x[valueKey || 'value'] : x, l = typeof x === 'object' ? x[labelKey || 'label'] : cap(x);
    h += '<option value="' + attr(v) + '"' + (String(v) === String(selected == null ? '' : selected) ? ' selected' : '') + '>' + esc(l) + '</option>';
  });
  return h;
}
function val(id) { var el = $(id); return el ? el.value : ''; }
function formVals(root) {
  var o = {}, el = typeof root === 'string' ? $(root) : root;
  el.querySelectorAll('[name]').forEach(function (i) {
    if (i.type === 'checkbox') { if (i.dataset.multi) { o[i.name] = o[i.name] || []; if (i.checked) o[i.name].push(i.value); } else o[i.name] = i.checked; }
    else if (i.type === 'radio') { if (i.checked) o[i.name] = i.value; }
    else if (i.type !== 'file') o[i.name] = i.value.trim();
  });
  return o;
}

/* ------------------------------ API ------------------------------ */
function setBusy(delta, text) {
  S.busy = Math.max(0, S.busy + delta);
  $('busy').classList.toggle('on', S.busy > 0);
  if (text) $('busyText').textContent = text;
}
function call(method) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    setBusy(1, 'Loading…');
    google.script.run.withSuccessHandler(function (r) { setBusy(-1); resolve(r); })
      .withFailureHandler(function (e) {
        setBusy(-1);
        var msg = (e && e.message) || String(e || 'Request failed');
        msg = msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '');
        if (/Session expired|Please login again/i.test(msg)) { sessionLost(msg); }
        reject(new Error(msg));
      }).callWithSession(method, args, S.token);
  });
}
/** Button-level progress ("Saving…"), no full-screen blocking. */
function act(btn, label, promiseFn) {
  var b = btn && btn.tagName ? btn : null, old = b ? b.innerHTML : '';
  if (b) { if (b.disabled) return Promise.resolve(); b.disabled = true; b.innerHTML = '<span class="spin"></span> ' + esc(label || 'Saving…'); }
  return Promise.resolve().then(promiseFn).then(function (r) {
    if (b) { b.disabled = false; b.innerHTML = old; }
    if (r && r.message) toast(r.message, 'good');
    return r;
  }, function (e) { if (b) { b.disabled = false; b.innerHTML = old; } showErr(e); throw e; });
}
var toastTimer = null;
function toast(msg, type) {
  var t = $('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.className = 'toast'; }, 5000);
}
function showErr(e) { toast((e && e.message) || String(e), 'bad'); }
function swallow() {}

/* --------------------------- FILES --------------------------- */
/** Reads a file input; images are resized to max 1600px JPEG so uploads stay small on mobile data. */
function readFile(inputId, maxPx) {
  var input = $(inputId), f = input && input.files && input.files[0];
  if (!f) return Promise.resolve(null);
  return new Promise(function (resolve, reject) {
    if (f.size > 12 * 1024 * 1024) return reject(new Error('File is larger than 12 MB.'));
    var r = new FileReader();
    r.onerror = function () { reject(new Error('Could not read the file.')); };
    r.onload = function () {
      if (!/^image\//.test(f.type) || /gif|svg/.test(f.type)) return resolve({ data: r.result, name: f.name, mime: f.type });
      var img = new Image();
      img.onload = function () {
        var max = maxPx || 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve({ data: c.toDataURL('image/jpeg', 0.75), name: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg' });
      };
      img.onerror = function () { resolve({ data: r.result, name: f.name, mime: f.type }); };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}
function fileField(id, label, required, accept) {
  return '<div class="field"><span>' + esc(label) + (required ? ' <em>*</em>' : '') + '</span><div class="photo-in"><input type="file" id="' + id + '" accept="' + (accept || 'image/*,application/pdf') + '" capture="environment"></div></div>';
}

/* ------------------------------ AUTH ------------------------------ */
function storeToken(t) { S.token = t || ''; try { if (t) localStorage.setItem('arhaan_v7_token', t); else localStorage.removeItem('arhaan_v7_token'); } catch (e) {} }
function loginIdle() { var b = $('loginBtn'); if (b) { b.disabled = false; b.textContent = 'Sign in'; } }
function doLogin() {
  var u = val('lu').trim(), p = val('lp'), m = $('loginMsg'), b = $('loginBtn');
  if (b.disabled) return;
  if (!u || !p) { m.textContent = 'Enter your user ID and password.'; return; }
  b.disabled = true; b.textContent = 'Signing in…'; m.textContent = ''; m.style.color = '';
  google.script.run.withSuccessHandler(function (r) {
    // keep the button busy until the first screen is ready, so it never looks like the page reset
    b.textContent = 'Loading your data…'; m.textContent = 'Signed in. Loading your data – the first load can take a few seconds.'; m.style.color = '';
    storeToken(r.token);
    startApp(r.must_change_password, function () { $('lp').value = ''; loginIdle(); });
  }).withFailureHandler(function (e) {
    loginIdle();
    m.textContent = String((e && e.message) || e).replace(/^Error:\s*/, ''); m.style.color = 'var(--red)';
  }).loginAppUser(u, p);
}
function startApp(mustChange, done, retried) {
  call('getBootstrap').then(function (b) {
    S.boot = b;
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    paintShell();
    if (mustChange || b.user.must_change_password) go('profile', { force: true }, { reset: true });
    else go(b.user.role_group === 'PARTNER' ? 'd2cDeliver' : 'home', {}, { reset: true });
    startTimers();
    if (done) done();
  }, function (e) {
    // a slow first call (server waking up) is retried once before asking for the password again
    if (!retried && S.token && !/expired|login again|Invalid|inactive|assigned/i.test(String(e && e.message))) { setTimeout(function () { startApp(mustChange, done, true); }, 1200); return; }
    if (done) done();
    showLoginScreen(e.message);
  });
}
function sessionLost(msg) { storeToken(''); showLoginScreen(msg || 'Session expired. Please sign in again.'); }
function showLoginScreen(msg) {
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
  var m = $('loginMsg'); m.textContent = msg || ''; m.style.color = msg ? 'var(--red)' : '';
  stopTimers();
}
function doLogout() {
  var t = S.token; storeToken(''); S.boot = null;
  google.script.run.withSuccessHandler(swallow).withFailureHandler(swallow).logoutAppUser(t);
  showLoginScreen('');
}
function switchCompany(cid) {
  if (!cid || (S.boot.company && cid === S.boot.company.company_id)) return;
  call('setActiveCompany', cid).then(function (b) {
    S.boot = b; S.cache = {}; paintShell();
    toast(b.company.all ? 'Showing all companies together. Choose one company to make changes.' : 'Now working in ' + b.company.company_name, 'good');
    go('home', {}, { reset: true });
  }, function (e) { showErr(e); paintShell(); });
}

var timers = [];
function startTimers() {
  stopTimers();
  var tick = function () { var d = new Date(); $('hClock').textContent = d.toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short' }) + ' · ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }); };
  tick(); timers.push(setInterval(tick, 30000));
  timers.push(setInterval(function () { if (!S.token || S.busy) return; call('ping').then(function (r) { setUnread(r.unread); }, swallow); }, 120000));
}
function stopTimers() { timers.forEach(clearInterval); timers = []; }
function setUnread(n) { S.boot.unread = n; var el = $('hUnread'); el.textContent = n > 99 ? '99+' : n; el.classList.toggle('hidden', !n); }

/** Order journey: Order → Supply → Dispatch → Delivery → POD → Invoice → Paid */
function routeStops(o, paid) {
  var st = o.status, closed = ['CANCELLED', 'REJECTED', 'VOID'].indexOf(st) >= 0;
  var rank = { DRAFT: 0, RECEIVED: 1, SUBMITTED: 1, SUPPLY_CONFIRMED: 2, PARTIAL_SUPPLY: 2, NOT_SUPPLIED: 2, INVOICED: 3, DISPATCHED: 4, OUT_FOR_DELIVERY: 4, DELIVERY_FAILED: 4,
    DELIVERED: 5, PARTIAL_DELIVERY: 5, DELIVERY_EXCEPTION: 5 }[st] || 0;
  var stops = [['Order', 1], ['Supply', 2], ['Invoice', 3], ['Dispatch', 4], ['Delivery', 5], ['POD', 6], ['Paid', 7]];
  return stops.map(function (s) {
    var n = s[1], cls = '';
    var reached = n <= rank || (n === 3 && !!o.invoice_id) || (n === 6 && o.has_pod) || (n === 7 && paid);
    if (n === 3 && rank >= 3 && !o.invoice_id) reached = false;
    if (n === 6 && rank >= 5 && !o.has_pod) reached = false;
    if (reached) cls = 'done';
    if (n === 2 && (st === 'PARTIAL_SUPPLY' || (reached && Number(o.short_value) > 0))) cls = 'warn';
    if (n === 2 && st === 'NOT_SUPPLIED') cls = 'bad';
    if (n === 5 && (st === 'PARTIAL_DELIVERY' || st === 'DELIVERY_EXCEPTION')) cls = 'warn';
    if (n === 5 && st === 'DELIVERY_FAILED') cls = 'bad';
    if (closed) cls = n === 1 ? 'bad' : '';
    return { label: closed && n === 1 ? 'Cancelled' : s[0], cls: cls, n: n, reached: reached };
  }).map(function (s, i, arr) {
    if (!closed && !s.cls) { var prev = arr[i - 1]; if (prev && (prev.cls === 'done' || prev.cls === 'warn') && !arr.slice(0, i).some(function (x) { return !x.cls; })) s.cls = 'now'; }
    return s;
  });
}

function miniRoute(o) { var m = { done: 'd', warn: 'w', bad: 'b' }; return '<div class="mini-route" aria-hidden="true">' + routeStops(o, false).map(function (s) { return '<i class="' + (m[s.cls] || '') + '"></i>'; }).join('') + '</div>'; }

function captureGps(latId, lngId, btn) {

    if (btn) { btn.disabled = false; btn.textContent = 'Location captured'; }

    html += '<div class="section"><h3>Order</h3><dl class="kv"><dt>Outlet</dt><dd><button class="link" onclick="go(\'customer\',{id:' + js(o.customer_id) + '})">' + esc(o.customer_name) + '</button> · ' + esc(o.area) + '</dd><dt>Salesman</dt><dd>' + esc(o.salesman_name) + (o.order_source === 'ADMIN_PUNCHED' ? ' (punched by ' + esc(o.punched_by_name) + ')' : '') + '</dd><dt>Beat</dt><dd>' + esc(o.beat_name) + '</dd>' +
      '<dt>Delivery date</dt><dd>' + (o.requested_delivery_date ? fdate(o.requested_delivery_date) + ' · ' + cap(o.delivery_day) : '–') + '</dd>' + (d.header.payment_type ? '<dt>Payment</dt><dd><b>' + (d.header.payment_type === 'CASH' ? 'Cash & carry' : 'Credit') + '</b></dd>' : '') + (d.header.ship_same === false ? '<dt>Ship To</dt><dd><b>' + esc(d.header.ship_name) + '</b><br>' + esc(d.header.ship_address) + (d.header.ship_mobile ? '<br>Ph ' + esc(d.header.ship_mobile) : '') + '</dd>' : '') + (d.header.customer_po ? '<dt>Customer PO</dt><dd>' + esc(d.header.customer_po) + '</dd>' : '') +
      (o.backorder_of ? '<dt>Backorder of</dt><dd><button class="link" onclick="go(\'orderDetail\',{id:' + js(o.backorder_of) + '})">' + esc(o.backorder_of) + '</button></dd>' : '') + (d.header.remarks ? '<dt>Remarks</dt><dd>' + esc(d.header.remarks) + '</dd>' : '') +
      (o.cancel_reason ? '<dt>Cancelled</dt><dd>' + esc(o.cancel_reason) + '</dd>' : '') + '<dt>Revision</dt><dd>' + d.header.revision + '</dd></dl></div>';
    html += '<div class="section"><h3>Products</h3><div class="tbl-wrap"><table class="tbl"><tr><th>Product</th><th class="n">Ordered</th><th class="n">Price</th><th class="n">Supplied</th><th class="n">Delivered</th><th class="n">Value</th></tr>' +
      d.lines.map(function (l) { return '<tr' + (l.removed ? ' style="opacity:.5;text-decoration:line-through"' : '') + '><td>' + esc(l.product_name) + (l.price_override_reason ? '<div class="tiny muted">Price note: ' + esc(l.price_override_reason) + '</div>' : '') + (l.short_reason ? '<div class="tiny" style="color:#8A5A00">Short: ' + esc(l.short_reason) + '</div>' : '') + (l.removed ? '<div class="tiny">removed</div>' : '') + '</td><td class="n">' + num(l.qty) + '</td><td class="n">' + money(l.rate) + '</td><td class="n">' + (l.supplied_qty === '' ? '–' : num(l.supplied_qty)) + '</td><td class="n">' + (l.delivered_qty === '' ? '–' : num(l.delivered_qty)) + '</td><td class="n">' + money(l.line_value) + '</td></tr>'; }).join('') + '</table></div></div>';
    if (d.exceptions.length) html += '<div class="section"><h3>Exceptions</h3><div class="rows">' + d.exceptions.map(function (e) { return '<div class="row static"><div class="m"><b style="white-space:normal">' + esc(cap(e.type)) + ' · ' + esc(cap(e.reason)) + (e.short_qty ? ' · ' + num(e.short_qty) + ' pcs' : '') + '</b><span style="white-space:normal">' + esc([e.explanation, e.owner ? 'Owner ' + e.owner : '', e.expected_resolution_date ? 'by ' + fdate(e.expected_resolution_date) : '', e.next_action ? 'Next: ' + cap(e.next_action) : '', e.backorder_order_id ? 'Backorder ' + e.backorder_order_id : ''].filter(Boolean).join(' · ')) + '</span></div>' + chip(e.status) + '</div>'; }).join('') + '</div></div>';
    if (d.dispatches.length || d.deliveries.length) html += '<div class="section"><h3>Dispatch &amp; delivery</h3><div class="rows">' +
      d.dispatches.map(function (x) { return '<div class="row static"><div class="m"><b>Dispatch ' + fdate(x.dispatch_date) + '</b><span>' + esc([x.vehicle, x.driver_name, x.route, num(x.cases) + ' cases'].filter(Boolean).join(' · ')) + '</span></div>' + chip(x.status) + '</div>'; }).join('') +
      d.deliveries.map(function (x) { return '<div class="row static"><div class="m"><b>Delivery ' + fdate(x.delivery_date) + ' · ' + money(x.delivered_value) + '</b><span style="white-space:normal">' + esc([x.receiver_name ? 'Received by ' + x.receiver_name : '', x.failure_reason, x.next_action ? 'Next: ' + cap(x.next_action) : '', x.damaged_qty ? x.damaged_qty + ' damaged' : '', x.rejected_qty ? x.rejected_qty + ' rejected' : ''].filter(Boolean).join(' · ')) + '</span></div>' + chip(x.delivery_status) + '</div>'; }).join('') +
      d.pods.map(function (x) { return '<div class="row static"><div class="m"><b>POD</b><span>' + esc(x.uploaded_by) + ' · ' + fdatetime(x.uploaded_at) + '</span></div><a class="btn sm ghost" target="_blank" href="' + attr(x.url) + '">View</a></div>'; }).join('') + '</div></div>';
    if (d.invoices.length) html += '<div class="section"><h3>Invoice, notes &amp; payment</h3><div class="rows">' + d.invoices.map(function (i) { return '<div class="row static"><div class="m"><b>' + esc(i.invoice_number) + ' · ' + money(i.invoice_value) + '</b><span>' + fdate(i.invoice_date) + ' · due ' + fdate(i.due_date) + (i.gst_invoice ? ' · taxable ' + money(i.taxable_value) + ' + GST ' + money(i.gst) : ' · Marg invoice') + '</span><span class="tiny">paid ' + money(i.paid) + (i.credited ? ' · credit notes ' + money(i.credited) : '') + (i.debited ? ' · debit notes ' + money(i.debited) : '') + (i.adjusted ? ' · adjusted ' + money(i.adjusted) : '') + (i.cancel_reason ? ' · ' + esc(i.cancel_reason) : '') + '</span></div><div class="r"><b>' + money(i.balance) + '</b>' + chip(i.status) + '</div></div>'; }).join('') +
      (d.notes || []).map(function (n) { return '<button class="row" onclick="openNoteDetail(' + js(n.note_id) + ')"><div class="m"><b>' + (n.note_type === 'CREDIT' ? 'Credit' : 'Debit') + ' note ' + esc(n.note_number || '(draft)') + ' · ' + money(n.note_value) + '</b><span>' + fdate(n.note_date) + ' · ' + esc(cap(n.reason_type)) + (n.stock_effect === 'YES' ? ' · stock returned' : '') + '</span></div>' + chip(n.status === 'DRAFT' ? 'PENDING' : n.status, cap(n.status)) + '</button>'; }).join('') + '</div></div>';
    html += '<div class="section"><h3>History</h3><div class="tl">' + d.history.map(function (h) { return '<div><b>' + esc(cap(h.to || 'Updated')) + '</b> <span class="small muted">' + fdatetime(h.at) + ' · ' + esc(h.by) + '</span><small>' + esc([h.reason, h.remarks].filter(Boolean).join(' – ')) + '</small></div>'; }).join('') + '</div></div>';
    setMain(html);
  }, failed);
};
function cancelOrderUi(id) {

/* =========================== SUPPLY =========================== */
VIEWS.supply = function (p) {
  Promise.all([call('getOrderDetail', p.id), call('listUserChoices')]).then(function (r) {
    var d = r[0], users = r[1], lines = d.lines.filter(function (l) { return !l.removed; });
    S.cache.supply = { id: p.id, lines: lines };
    var html = head('Confirm supply', esc(d.order.customer_name) + ' · ' + esc(d.order.order_id) + ' · ' + money(d.order.order_value));
    html += '<div class="section"><div class="section-head"><h3>Quantities</h3><button class="btn sm ghost" onclick="supplyAll()">Supply everything</button></div>' +
      lines.map(function (l, i) { return '<div class="line" id="sl' + i + '"><div class="top"><b>' + esc(l.product_name) + '</b><span class="num">' + num(l.qty) + ' pcs × ' + money(l.rate) + '</span></div>' +
        (l.stock_available !== null && l.stock_available !== undefined ? '<div class="small ' + (l.stock_available < l.qty ? '' : 'muted') + '" style="margin-top:4px' + (l.stock_available < l.qty ? ';color:#8A5A00' : '') + '">In stock (after other confirmed orders): <b>' + num(l.stock_available) + ' pcs</b></div>' : '') +
        '<div class="qtybox"><label class="field"><span>Available</span><input type="number" min="0" step="1" inputmode="numeric" id="sa' + i + '" value="' + supplyDefault(l) + '" oninput="supplyChanged(' + i + ')"></label><label class="field"><span>Supplied</span><input type="number" min="0" step="1" inputmode="numeric" id="ss' + i + '" value="' + supplyDefault(l) + '" oninput="supplyChanged(' + i + ')"></label></div>' +
        '<div id="sw' + i + '" class="hidden" style="margin-top:8px"><div class="small" id="sn' + i + '" style="color:#8A5A00;margin-bottom:6px"></div><div class="grid2"><label class="field"><span>Short reason <em>*</em></span><select id="sr' + i + '" onchange="supplyChanged(' + i + ')">' + opts(L('SHORT_SUPPLY'), '', 'Select reason') + '</select></label><label class="field" id="sel' + i + '"><span>Explanation</span><input id="se' + i + '"></label></div></div></div>'; }).join('') + '</div>';
    html += '<div class="section hidden" id="shortBox"><h3>Short supply follow-through</h3><div class="form"><div class="grid2"><label class="field"><span>Responsible owner <em>*</em></span><select id="sOwner">' + opts(users, S.boot.user.user_id, 'Select person', 'user_id', 'name') + '</select></label>' +
      '<label class="field"><span>Expected resolution date <em>*</em></span><input type="date" id="sDate" min="' + today() + '" value="' + addDays(today(), 2) + '"></label></div>' +
      '<label class="check"><input type="checkbox" id="sBack" checked> Create a backorder for the short quantity</label>' + fileField('sProof', 'Proof (optional)') + '</div></div>';
    html += '<div class="section"><label class="field"><span>Remarks</span><input id="sRem"></label></div>';
    html += '<div class="total-bar"><span>Supplied value</span><span class="v" id="sTotal"></span></div><div class="sticky-actions"><button class="btn ghost" onclick="back()">Cancel</button><button class="btn" style="flex:1" onclick="saveSupply(this)">Confirm supply</button></div>';
    setMain(html); lines.forEach(function (l, i) { supplyChanged(i); });
  }, failed);
};
function supplyDefault(l) { return l.stock_available === null || l.stock_available === undefined ? l.qty : Math.max(0, Math.min(l.qty, l.stock_available)); }
function supplyAll() { S.cache.supply.lines.forEach(function (l, i) { $('ss' + i).value = l.qty; $('sa' + i).value = Math.max(Number($('sa' + i).value) || 0, l.qty); supplyChanged(i); }); }
function supplyChanged(i) {
  var l = S.cache.supply.lines[i], sup = Number(val('ss' + i)) || 0, short = l.qty - sup;
  $('sw' + i).classList.toggle('hidden', short <= 0);
  $('sn' + i).textContent = short > 0 ? short + ' pcs short (' + money(short * l.rate) + ')' : '';
  $('sel' + i).querySelector('span').innerHTML = 'Explanation' + (val('sr' + i) === 'OTHER' ? ' <em>*</em>' : '');
  $('sl' + i).classList.toggle('low', short > 0);
  var anyShort = S.cache.supply.lines.some(function (x, j) { return x.qty - (Number(val('ss' + j)) || 0) > 0; });
  $('shortBox').classList.toggle('hidden', !anyShort);
  var tot = S.cache.supply.lines.reduce(function (a, x, j) { return a + (Number(val('ss' + j)) || 0) * x.rate; }, 0);
  $('sTotal').textContent = money(tot);
}
function saveSupply(btn) {
  var sc = S.cache.supply;
  act(btn, 'Confirming…', function () {
    return readFile('sProof').then(function (f) {
      return call('confirmSupply', { order_id: sc.id, owner_id: val('sOwner'), expected_resolution_date: val('sDate'), create_backorder: $('sBack').checked, remarks: val('sRem'),
        proof_base64: f ? f.data : '', proof_file_name: f ? f.name : '', proof_mime_type: f ? f.mime : '',
        lines: sc.lines.map(function (l, i) { return { order_line_id: l.order_line_id, available_qty: Number(val('sa' + i)), supplied_qty: Number(val('ss' + i)), short_reason: val('sr' + i), explanation: val('se' + i) }; }) });
    });
  }).then(function (r) {
    go('orderDetail', { id: sc.id }, { replace: true });
    if (r && r.status !== 'NOT_SUPPLIED' && can('invoice.create')) setTimeout(function () { openInvoiceForm(sc.id); }, 400);
  }, swallow);
}

/* =========================== DISPATCH =========================== */
VIEWS.dispatch = function (p) {
  call('getDispatchFormData').then(function (d) {
    var pre = (p && p.ids) || [];
    var html = head('Dispatch', 'Orders with confirmed supply · ' + companyLine());
    if (!d.orders.length) return setMain(html + '<div class="section">' + emptyState('Nothing ready to dispatch', 'Confirm supply on received orders first.') + '</div>');
    html += '<div class="section"><div class="section-head"><h3>Orders</h3><span class="muted small">Tick all orders going on this trip</span></div><div class="rows" id="dOrders">' +
      d.orders.map(function (o) { return '<label class="row"><input type="checkbox" style="width:20px;height:20px;min-height:0" value="' + attr(o.order_id) + '"' + (pre.indexOf(o.order_id) >= 0 || (!pre.length && d.orders.length === 1) ? ' checked' : '') + '><div class="m"><b>' + esc(o.customer_name) + '</b><span>' + esc([o.area, o.beat_name, 'delivery ' + fdate(o.requested_delivery_date)].join(' · ')) + '</span></div><div class="r"><b>' + money(o.supplied_value || o.order_value) + '</b>' + chip(o.status, o.status_label) + '</div></label>'; }).join('') + '</div></div>';
    html += '<div class="section"><div class="form" id="dForm"><div class="grid2"><label class="field"><span>Transport</span><select name="transport_mode">' + opts([{ value: 'OWN', label: 'Own vehicle' }, { value: 'HIRED', label: 'Hired transport' }], 'OWN') + '</select></label>' +
      '<label class="field"><span>Vehicle</span><select name="vehicle_id" onchange="var v=(S.cache.dv||[]).filter(function(x){return x.vehicle_id===this.value},this)[0];if(v&&v.driver_id)$(\'dDriver\').value=v.driver_id">' + opts(d.vehicles, '', 'Select vehicle', 'vehicle_id', 'label') + '</select></label></div>' +
      '<div class="grid2"><label class="field"><span>Delivery person / driver <em>*</em></span><select name="driver_id" id="dDriver">' + opts(d.drivers, '', 'Select person', 'user_id', 'name') + '</select>' + (d.drivers.length ? '' : '<small>No delivery person has access to this company. Add one in Admin → Users.</small>') + '</label>' +
      '<label class="field"><span>Expected delivery</span><input type="date" name="expected_delivery_date"></label></div><label class="field"><span>Route</span><input name="route" placeholder="e.g. East loop"></label><label class="field"><span>Remarks</span><input name="remarks"></label></div></div>' +
      '<div class="sticky-actions"><button class="btn ghost" onclick="back()">Cancel</button><button class="btn" style="flex:1" onclick="saveDispatch(this)">Dispatch selected</button></div>';
    S.cache.dv = d.vehicles;
    setMain(html);
  }, failed);
};
function saveDispatch(btn) {
  var ids = [].slice.call(document.querySelectorAll('#dOrders input:checked')).map(function (i) { return i.value; });
  if (!ids.length) return toast('Tick at least one order.', 'bad');
  var v = formVals('dForm'); v.order_ids = ids;
  act(btn, 'Dispatching…', function () { return call('createDispatch', v); }).then(function () { go('control', { stage: 'DELIVERY' }, { replace: true }); }, swallow);
}

/* =========================== DELIVERIES =========================== */
VIEWS.deliveries = function () {
  call('getMyDeliveries').then(function (d) {
    S.cache.deliveries = d;
    var todo = d.rows.filter(function (r) { return r.stage === 'TO_DELIVER'; }), pod = d.rows.filter(function (r) { return r.stage === 'POD_PENDING'; });
    setMain(head(group() === 'DELIVERY' ? 'My deliveries' : 'Deliveries', num(todo.length) + ' to deliver · ' + num(pod.length) + ' POD pending', '<button class="btn sm" onclick="downloadDispatchSheet(this)">Download Excel</button>') +
      '<div class="section"><h3>To deliver</h3>' + deliveryRows(todo) + '</div><div class="section"><h3>Delivered – POD pending</h3>' + deliveryRows(pod) + '</div>');
  }, failed);
};
function downloadDispatchSheet(btn) {
  act(btn, 'Preparing…', function () {
    return call('getDispatchSheet', {}).then(function (r) {
      if (!r.rows.length) return { message: 'No dispatched deliveries to download.' };
      return loadSheetJs().then(function (XLSX) { XLSX.writeFile(reportWorkbook(XLSX, Object.assign({ plain: true }, r)), r.file_name); return { message: '✓ ' + r.file_name + ' downloaded.' }; });
    });
  }).catch(swallow);
}
function deliveryRows(rows) {

    var action = r.stage === 'TO_DELIVER' ? '<button class="btn sm" onclick="event.stopPropagation();go(\'deliveryForm\',{dispatch_id:' + js(r.dispatch_id) + '})">Deliver</button>' : '<button class="btn sm" onclick="event.stopPropagation();openPodUpload(' + js(r.delivery_id) + ',' + js(r.order_id) + ')">Upload POD</button>';
    return '<div class="row static"><div class="m"><b>' + esc(r.customer_name) + '</b><span>' + esc(r.address) + '</span><span class="tiny">' + esc([fdate(r.expected_delivery_date), r.vehicle, r.route, money0(r.dispatch_value)].filter(Boolean).join(' · ')) +

  }).join('') + '</div>';
}
VIEWS.deliveryForm = function (p) {

      '<label class="field"><span>Remarks <em>*</em></span><textarea name="remarks"></textarea></label><label class="field"><span>Commitment date (if promised)</span><input type="date" name="commitment_date"></label>' +

  }, showErr);
}
function closeFollowupUi(id) {
  openModal('<h3>Complete follow-up</h3><div class="form" id="fcForm"><label class="field"><span>Outcome <em>*</em></span><textarea name="outcome" placeholder="What happened?"></textarea></label><label class="field"><span>Next follow-up date (optional)</span><input type="date" name="next_followup_date" min="' + today() + '"></label><label class="field"><span>Note for next follow-up</span><input name="remarks"></label>' +
    '<div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="fcOk">Mark done</button></div></div>');

/* =========================== DAILY CLOSING =========================== */
VIEWS.closing = function (p) {
  p = p || {};
  var day = p.date || today();
  call('getDailyClosing', day, p.salesman_id || '').then(function (d) {
    if (d.list) {
      return setMain(head('Daily closing', 'Salesmen · ' + companyLine()) + '<div class="filters"><label class="field"><span>Date</span><input type="date" max="' + today() + '" value="' + day + '" onchange="go(\'closing\',{date:this.value},{replace:true})"></label></div>' +
        '<div class="section"><div class="rows">' + d.list.map(function (s) { return '<button class="row" onclick="go(\'closing\',{date:' + js(day) + ',salesman_id:' + js(s.salesman_id) + '})"><div class="m"><b>' + esc(s.name) + '</b><span>' + num(s.completed) + '/' + num(s.planned) + ' outlets · ' + num(s.orders) + ' orders ' + money0(s.order_value) + ' · collected ' + money0(s.collections) + '</span></div>' + chip(s.closing_status) + '</button>'; }).join('') + '</div></div>');
    }
    S.cache.closing = d;
    var closed = d.closing_status === 'CLOSED', mine = !p.salesman_id;
    var html = head(mine ? 'Daily closing' : d.salesman_name, fdate(d.date) + ' · ' + cap(d.day) + ' · ' + esc(d.company_name), chip(closed ? 'CLOSED' : 'NOT CLOSED', closed ? 'Closed' : 'Open'));
    if (mine) html += '<div class="filters"><label class="field"><span>Day</span><input type="date" max="' + today() + '" min="' + addDays(today(), -3) + '" value="' + day + '" onchange="go(\'closing\',{date:this.value},{replace:true})"></label></div>';
    html += '<div class="kpis">' + kpi('Planned outlets', num(d.planned), esc(d.beats.join(', ') || 'No beat planned')) + kpi('Covered', num(d.completed), (d.extra_visits ? '+' + d.extra_visits + ' outside plan' : ''), 'sales') +
      kpi('Missed', num(d.missed_count), 'reason needed', d.missed_count ? 'warn' : '') + kpi('Orders', num(d.orders_count), money0(d.order_value), 'order') +
      kpi('Collected', money0(d.collections), '', 'cash') + kpi('Follow-ups', num(d.followups_completed) + ' done', num(d.followups_pending) + ' pending', d.followups_pending ? 'warn' : '') +
      kpi('Open issues', num(d.pending_orders + d.short_supplies + d.failed_deliveries), num(d.pending_orders) + ' pending · ' + num(d.short_supplies) + ' short · ' + num(d.failed_deliveries) + ' failed', '') + kpi('Outstanding', money0(d.outstanding), '', d.outstanding ? 'due' : '') + '</div>';
    if (d.missed.length) html += '<div class="section"><div class="section-head"><h3>Missed planned outlets</h3>' + (!closed && mine ? '<label class="small">Same reason for all <select style="min-height:34px;font-size:14px;width:auto" onchange="document.querySelectorAll(\'.mrs\').forEach(function(s){if(!s.value)s.value=this.value},this)">' + opts(d.reasons, '', 'Choose') + '</select></label>' : '') + '</div><div class="rows">' +
      d.missed.map(function (m, i) { return '<div class="row static" style="flex-wrap:wrap"><div class="m" style="min-width:160px"><b>' + esc(m.customer_name) + '</b><span>' + esc(m.area) + '</span></div>' + (closed || !mine || m.reason ? chip('', cap(m.reason) || 'No reason') :
        '<div style="display:flex;gap:6px;flex:1;min-width:220px"><select class="mrs" data-cid="' + attr(m.customer_id) + '" style="min-height:38px">' + opts(d.reasons, '', 'Reason') + '</select><input class="mrr" data-cid="' + attr(m.customer_id) + '" placeholder="Note" style="min-height:38px"></div>') + '</div>'; }).join('') + '</div></div>';
    if (!closed && mine) html += '<div class="section"><label class="field"><span>Remarks for the day</span><textarea id="clRem"></textarea></label></div><div class="sticky-actions"><button class="btn" style="flex:1" onclick="submitClosing(this)">Submit daily closing</button></div>';
    else if (d.remarks) html += '<div class="section"><h3>Remarks</h3>' + esc(d.remarks) + '</div>';
    setMain(html);
  }, failed);
};
function submitClosing(btn) {
  var d = S.cache.closing, missed = [];
  document.querySelectorAll('.mrs').forEach(function (s) { var note = document.querySelector('.mrr[data-cid="' + s.dataset.cid + '"]'); missed.push({ customer_id: s.dataset.cid, reason: s.value, remarks: note ? note.value : '' }); });
  act(btn, 'Submitting…', function () { return call('submitDailyClosing', { date: d.date, missed: missed, remarks: val('clRem') }); }).then(refresh, swallow);
}

/* ---------- V7.7 my beats: a salesman asks for a new beat, Admin approves it ---------- */
VIEWS.myBeats = function () {
  Promise.all([call('listBeats', { salesman_id: S.boot.user.user_id }), call('listPendingBeats')]).then(function (r) {
    var live = r[0], pend = r[1];
    var row = function (b, st) { return '<div class="row static"><div class="m"><b>' + esc(b.beat_name) + '</b><span>' + esc([b.territory, b.days.map(function (d) { return cap(d).slice(0, 3); }).join(' '), b.outlets != null ? num(b.outlets) + ' outlets' : ''].filter(Boolean).join(' · ')) + '</span></div>' + chip(st || b.status) + '</div>'; };
    setMain(head('My beats', num(live.length) + ' live' + (pend.length ? ' · ' + num(pend.length) + ' waiting for approval' : '') + ' · ' + companyLine(), '<button class="btn sm" onclick="openMyBeatForm()">New beat</button>') +
      '<div class="note small" style="margin-bottom:12px">A new beat goes live after Admin approves it. You will get a notification.</div>' +
      (pend.length ? '<div class="section"><h3>Waiting for approval</h3><div class="rows">' + pend.map(function (b) { return row(b, 'PENDING'); }).join('') + '</div></div>' : '') +
      '<div class="section"><h3>Live beats</h3>' + (live.length ? '<div class="rows">' + live.map(function (b) { return row(b); }).join('') + '</div>' : emptyState('No beats yet', 'Tap New beat to add your first route.')) + '</div>');
  }, failed);
};
function openMyBeatForm() {
  openModal('<h3>New beat</h3><div class="form" id="mbF"><div class="note small">' + companyLine() + ' · goes to Admin for approval</div>' +
    '<div class="grid2"><label class="field"><span>Beat name <em>*</em></span><input name="beat_name"></label><label class="field"><span>Territory / area</span><input name="territory"></label></div>' +
    '<div class="field"><span>Working days <em>*</em></span><div class="days">' + L('DAYS').map(function (d) { return '<label><input type="checkbox" name="days" data-multi="1" value="' + d + '">' + cap(d).slice(0, 3) + '</label>'; }).join('') + '</div></div>' +
    '<label class="field"><span>Route (areas in order)</span><input name="route_sequence"></label>' +
    '<div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="mbOk">Send for approval</button></div></div>');
  $('mbOk').onclick = function () { var v = formVals('mbF'); act(this, 'Sending…', function () { return call('saveBeat', v); }).then(function () { closeModal(); refresh(); }, swallow); };
}
</script>

/* =========================== VEHICLES & FUEL =========================== */
VIEWS.vehicles = function (p) {
  p = p || {}; var month = p.month || today().slice(0, 7);
  Promise.all([call('listVehicles'), call('listFuel', { month: month })]).then(function (r) {
    var vs = r[0], f = r[1]; S.cache.vehicles = vs;
    var html = head('Vehicles & fuel', num(vs.length) + ' vehicles', '<div class="actions">' + '<button class="btn sm" onclick="openFuelForm()">Record fuel</button>' + (can('vehicle.manage') ? '<button class="btn sm ghost" onclick="openVehicleForm()">Add vehicle</button>' : '') + '</div>');
    html += '<div class="filters"><label class="field"><span>Month</span><input type="month" value="' + month + '" onchange="go(\'vehicles\',{month:this.value},{replace:true})"></label></div>';
    html += '<div class="kpis">' + kpi('Fuel cost', money0(f.total_amount), num(f.rows.length) + ' fills', 'warn') + kpi('Distance', num(f.total_km) + ' km', '') + kpi('Cost per km', f.total_km ? money(f.total_amount / f.total_km) : '–', '') + '</div>';
    if (f.summary.length) html += '<div class="section"><h3>By vehicle</h3><div class="tbl-wrap"><table class="tbl"><tr><th>Vehicle</th><th class="n">KM</th><th class="n">Litres</th><th class="n">Cost</th><th class="n">KM/L</th><th class="n">₹/KM</th></tr>' + f.summary.map(function (s) { return '<tr><td>' + esc(s.vehicle) + '</td><td class="n">' + num(s.km) + '</td><td class="n">' + num(s.litres) + '</td><td class="n">' + money0(s.amount) + '</td><td class="n">' + s.km_per_litre + '</td><td class="n">' + money(s.cost_per_km) + '</td></tr>'; }).join('') + '</table></div></div>';
    html += '<div class="section"><h3>Vehicles</h3>' + (vs.length ? '<div class="rows">' + vs.map(function (v) { return '<div class="row static"><div class="m"><b>' + esc(v.vehicle_number) + '</b><span>' + esc([cap(v.vehicle_type), cap(v.ownership), v.driver_name].filter(Boolean).join(' · ')) + '</span></div>' + chip(v.status) + (can('vehicle.manage') ? '<button class="btn sm ghost" onclick="openVehicleForm(' + js(v.vehicle_id) + ')">Edit</button>' : '') + '</div>'; }).join('') + '</div>' : emptyState('No vehicles yet', can('vehicle.manage') ? 'Add your delivery vehicles to track dispatch and fuel.' : '')) + '</div>';
    html += '<div class="section"><h3>Fuel log</h3>' + (f.rows.length ? '<div class="rows">' + f.rows.map(function (x) { return '<div class="row static"><div class="m"><b>' + esc(x.vehicle) + ' · ' + num(x.litres) + ' L</b><span>' + esc(fdate(x.fuel_date) + ' · ' + x.opening_km + '→' + x.closing_km + ' km · ' + x.km_per_litre + ' km/L · ₹' + x.cost_per_km + '/km' + (x.station ? ' · ' + x.station : '') + ' · ' + x.driver) + '</span></div><div class="r"><b>' + money(x.amount) + '</b>' + (x.receipt ? '<a class="tiny" target="_blank" href="' + attr(x.receipt) + '">Receipt</a>' : '') + '</div></div>'; }).join('') + '</div>' : emptyState('No fuel entries this month', '')) + '</div>';
    setMain(html);
  }, failed);

function openVehicleForm(id) {

function openFuelForm() {

      '<div class="grid2"><label class="field"><span>Litres <em>*</em></span><input name="litres" type="number" step="0.01" inputmode="decimal" oninput="fuelCalc()"></label><label class="field"><span>Amount (₹) <em>*</em></span><input name="fuel_amount" type="number" step="0.01" inputmode="decimal" oninput="fuelCalc()"></label></div>' +
      '<div class="note small" id="fuCalc">KM/L and cost per KM are calculated automatically.</div>' +

      '<label class="field"><span>Purpose / trip</span><input name="purpose"></label>' + fileField('fuProof', 'Fuel receipt', S.boot.config.fuel_receipt_required) +

function fuelCalc() {

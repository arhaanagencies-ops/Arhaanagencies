    '<div class="grid2"><label class="field"><span>Freight (₹)</span><input name="freight" type="number" step="0.01" oninput="trCalc()"></label><label class="field"><span>Loading (₹)</span><input name="loading" type="number" step="0.01" oninput="trCalc()"></label></div>' +
    '<div class="grid2"><label class="field"><span>Unloading (₹)</span><input name="unloading" type="number" step="0.01" oninput="trCalc()"></label><label class="field"><span>Waiting (₹)</span><input name="waiting" type="number" step="0.01" oninput="trCalc()"></label></div>' +
    '<div class="total-bar"><span>Total</span><span class="v" id="trTot">₹0.00</span></div><label class="field"><span>Reason for hiring</span><input name="reason"></label>' + fileField('trProof', 'Bill / proof', true) +
    '<div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="trOk">Save bill</button></div></div>');
  $('trOk').onclick = function () {
    var v = formVals('trF');
    act(this, 'Saving…', function () { return readFile('trProof').then(function (f) { if (f) { v.proof_base64 = f.data; v.proof_file_name = f.name; v.proof_mime_type = f.mime; } return call('recordTransport', v); }); }).then(function () { closeModal(); refresh(); }, swallow);
  };
}
function trCalc() { var v = formVals('trF'); $('trTot').textContent = money(['freight', 'loading', 'unloading', 'waiting'].reduce(function (a, k) { return a + (Number(v[k]) || 0); }, 0)); }
</script>

<script>
/* =========================== FINANCE =========================== */
VIEWS.finance = function (p) {
  p = Object.assign({ tab: 'invoices' }, p || {}); S.params = p;
  var tabs = [['invoices', 'Invoices'], ['payments', 'Payments'], ['adjustments', 'Adjustments']];
  if (isSales()) tabs = [['invoices', 'My outlets'], ['payments', 'My collections']];
  var tabHtml = '<div class="tabs">' + tabs.map(function (t) { return '<button class="' + (t[0] === p.tab ? 'on' : '') + '" onclick="go(\'finance\',{tab:\'' + t[0] + '\'},{replace:true})">' + t[1] + '</button>'; }).join('') + '</div>';
  var title = isSales() ? 'My outstanding' : 'Finance';
  if (p.tab === 'invoices') {
    call('listInvoices', { status: p.status || 'OPEN', from: p.from || '', to: p.to || '', q: p.q || '', bucket: p.bucket || '' }).then(function (r) {
      var html = head(title, companyLine()) + tabHtml;
      html += '<div class="kpis">' + kpi('Outstanding', money0(r.total_balance), num(r.count) + ' invoices', 'due') + kpi('Overdue', money0(r.overdue), '', r.overdue ? 'due' : '') +
        Object.keys(r.buckets).filter(function (b) { return b !== 'NOT DUE'; }).slice(0, 2).map(function (b) { return kpi(cap(b), money0(r.buckets[b]), '', r.buckets[b] ? 'warn' : '', "go('finance',{tab:'invoices',status:'OPEN',bucket:'" + b + "'},{replace:true})"); }).join('') + '</div>';
      html += '<div class="section"><h3>Ageing</h3><div class="tbl-wrap"><table class="tbl"><tr>' + Object.keys(r.buckets).map(function (b) { return '<th class="n">' + esc(cap(b)) + '</th>'; }).join('') + '</tr><tr>' + Object.keys(r.buckets).map(function (b) { return '<td class="n"><button class="link" onclick="go(\'finance\',{tab:\'invoices\',status:\'OPEN\',bucket:\'' + b + '\'},{replace:true})">' + money0(r.buckets[b]) + '</button></td>'; }).join('') + '</tr></table></div></div>';
      html += '<div class="filters" id="invF"><label class="field"><span>Show</span><select name="status">' + opts([{ value: 'OPEN', label: 'With balance' }, { value: 'OVERDUE', label: 'Overdue' }, { value: 'PAID', label: 'Paid' }, { value: 'ALL', label: 'All' }, { value: 'CANCELLED', label: 'Cancelled' }], p.status || 'OPEN') + '</select></label>' +
        '<label class="field"><span>From</span><input type="date" name="from" value="' + attr(p.from || '') + '"></label><label class="field"><span>To</span><input type="date" name="to" value="' + attr(p.to || '') + '"></label>' +
        '<label class="field"><span>Search</span><input name="q" type="search" value="' + attr(p.q || '') + '" placeholder="Invoice, outlet"></label><div class="actions wide"><button class="btn" onclick="var v=formVals(\'invF\');v.tab=\'invoices\';go(\'finance\',v,{replace:true})">Apply</button>' + (p.bucket ? '<button class="btn ghost" onclick="go(\'finance\',{tab:\'invoices\'},{replace:true})">Clear ' + esc(cap(p.bucket)) + '</button>' : '') + '</div></div>';
      html += '<div class="section">' + (r.rows.length ? '<div class="rows">' + r.rows.map(function (i) {
        return '<div class="row static"><div class="m"><b>' + esc(i.customer_name) + ' · ' + esc(i.invoice_number) + '</b><span>' + fdate(i.invoice_date) + ' · due ' + fdate(i.due_date) + (i.overdue ? ' · <b style="display:inline;color:var(--red)">' + i.age_days + ' days overdue</b>' : '') + ' · ' + esc(i.salesman_name) + '</span><span class="tiny">' + money(i.invoice_value) + ' billed · ' + money(i.paid) + ' paid' + (i.adjusted ? ' · ' + money(i.adjusted) + ' adjusted' : '') + '</span></div>' +
          '<div class="r"><b>' + money(i.balance) + '</b>' + chip(i.status) + '<div class="actions" style="justify-content:flex-end;margin-top:4px">' + '<button class="btn sm ghost" onclick="go(\'orderDetail\',{id:' + js(i.order_id) + '})">Order</button>' +
          (can('adjustment.request') && i.balance > 0 ? '<button class="btn sm ghost" onclick="openAdjustment(' + js(i.invoice_id) + ',' + js(i.invoice_number) + ',' + i.balance + ')">Adjust</button>' : '') +
          (can('invoice.cancel') && i.status !== 'CANCELLED' && !i.paid && !i.adjusted ? '<button class="btn sm danger" onclick="cancelInvoiceUi(' + js(i.invoice_id) + ')">Cancel</button>' : '') + '</div></div></div>';
      }).join('') + '</div>' : emptyState('No invoices here', '')) + '</div>';
      setMain(html);
    }, failed);
  } else if (p.tab === 'payments') {
    call('listPayments', { status: p.status || 'ALL', from: p.from || '', to: p.to || '', mine: isSales() }).then(function (r) {
      var html = head(title, companyLine()) + tabHtml + '<div class="kpis">' + kpi('Received', money0(r.total), num(r.count) + ' payments', 'cash') + kpi('Unallocated', money0(r.unallocated), 'not yet set against invoices', r.unallocated ? 'warn' : '') + '</div>';
      html += '<div class="filters" id="payF"><label class="field"><span>Status</span><select name="status">' + opts([{ value: 'ALL', label: 'All' }, { value: 'PENDING', label: 'Waiting verification' }, { value: 'APPROVED', label: 'Verified' }, { value: 'UNALLOCATED', label: 'With unallocated amount' }, { value: 'REJECTED', label: 'Rejected' }], p.status || 'ALL') + '</select></label>' +
        '<label class="field"><span>From</span><input type="date" name="from" value="' + attr(p.from || '') + '"></label><label class="field"><span>To</span><input type="date" name="to" value="' + attr(p.to || '') + '"></label><div class="actions" style="align-items:flex-end"><button class="btn" onclick="var v=formVals(\'payF\');v.tab=\'payments\';go(\'finance\',v,{replace:true})">Apply</button></div></div>';
      html += '<div class="section">' + (r.rows.length ? '<div class="rows">' + r.rows.map(function (pm) {
        var tools = '';
        if (can('payment.approve') && pm.approval_status === 'PENDING') tools += '<button class="btn sm ok" onclick="approvePaymentUi(' + js(pm.payment_id) + ',true)">Verify</button><button class="btn sm danger" onclick="approvePaymentUi(' + js(pm.payment_id) + ',false)">Reject</button>';
        if (can('payment.allocate') && pm.unallocated > 0) tools += '<button class="btn sm" onclick="openAllocation(' + js(pm.payment_id) + ')">Allocate</button>';
        if (pm.proof) tools += '<a class="btn sm ghost" target="_blank" href="' + attr(pm.proof) + '">Proof</a>';
        if (can('payment.allocate') && pm.allocated > 0) tools += '<button class="btn sm ghost" onclick="openAllocation(' + js(pm.payment_id) + ')">Details</button>';
        return paymentRow(pm).replace('</div></div>', '</div>' + (tools ? '<div class="actions" style="justify-content:flex-end;margin-top:4px">' + tools + '</div>' : '') + '</div>');
      }).join('') + '</div>' : emptyState('No payments here', '')) + '</div>';
      setMain(html);
    }, failed);
  } else {
    call('listAdjustments', { status: 'ALL' }).then(function (rows) {
      setMain(head(title, companyLine()) + tabHtml + '<div class="section"><p class="muted small" style="margin-top:0">Credit notes, discounts and write-offs reduce outstanding only after Admin approval. Raise one from an invoice (Invoices → Adjust).</p>' + (rows.length ? '<div class="rows">' + rows.map(function (a) {
        return '<div class="row static"><div class="m"><b>' + esc(a.customer_name) + ' · ' + esc(a.invoice_number) + '</b><span style="white-space:normal">' + esc(cap(a.type)) + ' – ' + esc(a.reason) + '</span><span class="tiny">' + fdate(a.requested_at) + ' · ' + esc(a.requested_by) + (a.approved_by ? ' · ' + esc(a.approved_by) : '') + (a.rejection_reason ? ' · ' + esc(a.rejection_reason) : '') + '</span></div><div class="r"><b>' + money(a.amount) + '</b>' + chip(a.status) +
          (can('adjustment.approve') && a.status === 'PENDING' ? '<div class="actions" style="margin-top:4px"><button class="btn sm ok" onclick="approveAdjUi(' + js(a.adjustment_id) + ',true)">Approve</button><button class="btn sm danger" onclick="approveAdjUi(' + js(a.adjustment_id) + ',false)">Reject</button></div>' : '') + '</div></div>';
      }).join('') + '</div>' : emptyState('No adjustments', '')) + '</div>');
    }, failed);
  }
};
function cancelInvoiceUi(id) { askReason('Cancel invoice', null, { textLabel: 'Why is this invoice cancelled?', danger: true, okLabel: 'Cancel invoice' }).then(function (r) { act(null, '', function () { return call('cancelInvoice', id, r.reason); }).then(refresh, swallow); }); }
function approvePaymentUi(id, ok) {
  if (ok) return act(null, '', function () { return call('approvePayment', id, true, ''); }).then(refresh, swallow);
  askReason('Reject collection', null, { textLabel: 'Reason for rejection', danger: true, okLabel: 'Reject' }).then(function (r) { act(null, '', function () { return call('approvePayment', id, false, r.reason); }).then(refresh, swallow); });
}
function approveAdjUi(id, ok) {
  if (ok) return act(null, '', function () { return call('approveAdjustment', id, true, ''); }).then(refresh, swallow);
  askReason('Reject adjustment', null, { danger: true, okLabel: 'Reject' }).then(function (r) { act(null, '', function () { return call('approveAdjustment', id, false, r.reason); }).then(refresh, swallow); });
}
function openAdjustment(invoiceId, number, balance) {
  openModal('<h3>Adjustment on ' + esc(number) + '</h3><div class="form" id="adjF"><div class="note small">Outstanding ' + money(balance) + '. Approved adjustments reduce the outstanding; history is kept.</div>' +
    '<div class="grid2"><label class="field"><span>Type <em>*</em></span><select name="adjustment_type">' + opts(L('ADJUSTMENT'), '', 'Select type') + '</select></label><label class="field"><span>Amount (₹) <em>*</em></span><input name="amount" type="number" step="0.01" min="0" max="' + balance + '" inputmode="decimal"></label></div>' +
    '<label class="field"><span>Reason <em>*</em></span><textarea name="reason"></textarea></label>' + fileField('adjProof', 'Supporting document') +
    '<div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="adjOk">Submit adjustment</button></div></div>');
  $('adjOk').onclick = function () {
    var v = formVals('adjF'); v.invoice_id = invoiceId;
    act(this, 'Saving…', function () { return readFile('adjProof').then(function (f) { if (f) { v.proof_base64 = f.data; v.proof_file_name = f.name; v.proof_mime_type = f.mime; } return call('requestAdjustment', v); }); }).then(function () { closeModal(); refresh(); }, swallow);
  };
}
function openAllocation(paymentId) {
  call('getPaymentDetail', paymentId).then(function (d) {
    var pm = d.payment;
    var html = '<h3>Allocate payment</h3><div class="note small" style="margin-bottom:10px">' + esc(pm.customer_name) + ' · ' + money(pm.amount) + ' ' + esc(cap(pm.mode)) + ' on ' + fdate(pm.payment_date) + '<br><b>' + money(pm.unallocated) + ' unallocated</b></div>';
    if (d.allocations.length) html += '<div class="rows" style="margin-bottom:10px">' + d.allocations.map(function (a) { return '<div class="row static"><div class="m"><b>' + esc(a.invoice_number) + ' · ' + money(a.amount) + '</b><span>' + fdatetime(a.allocated_at) + ' · ' + esc(a.allocated_by) + (a.remarks ? ' · ' + esc(a.remarks) : '') + '</span></div>' + (a.status === 'REVERSED' ? chip('CANCELLED', 'Reversed') : (isAdmin() ? '<button class="btn sm danger" onclick="reverseAllocUi(' + js(a.allocation_id) + ',' + js(paymentId) + ')">Reverse</button>' : '')) + '</div>'; }).join('') + '</div>';
    if (pm.unallocated > 0 && pm.approval_status === 'APPROVED') {
      html += d.open_invoices.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Invoice</th><th class="n">Balance</th><th class="n">Allocate</th></tr>' + d.open_invoices.map(function (i) { return '<tr><td>' + esc(i.invoice_number) + '<div class="tiny muted">' + fdate(i.invoice_date) + '</div></td><td class="n">' + money(i.balance) + '</td><td class="n"><input type="number" step="0.01" min="0" max="' + i.balance + '" class="alloc" data-inv="' + attr(i.invoice_id) + '"></td></tr>'; }).join('') + '</table></div>' +
        '<div class="actions end" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn quiet" id="alAuto">Oldest first</button><button class="btn" id="alOk">Allocate</button></div>'
        : '<div class="note warn">No open invoices for this outlet. The amount stays as advance and can be allocated when the next invoice is posted.</div><div class="actions end" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button></div>';
    } else html += '<div class="actions end"><button class="btn ghost" onclick="closeModal()">Close</button></div>';
    openModal(html);
    if ($('alOk')) {
      $('alOk').onclick = function () {
        var rows = [].slice.call(document.querySelectorAll('.alloc')).map(function (i) { return { invoice_id: i.dataset.inv, amount: Number(i.value) || 0 }; }).filter(function (r) { return r.amount > 0; });
        act(this, 'Allocating…', function () { return call('allocatePayment', { payment_id: paymentId, allocations: rows }); }).then(function () { closeModal(); refresh(); }, swallow);
      };
      $('alAuto').onclick = function () { act(this, 'Allocating…', function () { return call('autoAllocatePayment', paymentId); }).then(function () { closeModal(); refresh(); }, swallow); };
    }
  }, showErr);
}
function reverseAllocUi(id, paymentId) { askReason('Reverse allocation', null, { danger: true, okLabel: 'Reverse' }).then(function (r) { act(null, '', function () { return call('reverseAllocation', id, r.reason); }).then(function () { openAllocation(paymentId); }, swallow); }); }

VIEWS.statement = function (p) {
  call('getCustomerStatement', p.id).then(function (s) {
    setMain(head('Statement', esc(s.customer_name)) + '<div class="kpis">' + kpi('Outstanding', money0(s.outstanding), '', 'due') + kpi('Advance', money0(s.unallocated_advance), 'unallocated', 'warn') + kpi('Net balance', money0(s.net_balance), 'invoices − payments − adjustments') + kpi('Credit limit', money0(s.credit_limit), '') + '</div>' +
      '<div class="section"><div class="tbl-wrap"><table class="tbl"><tr><th>Date</th><th>Entry</th><th>Ref</th><th class="n">Debit</th><th class="n">Credit</th><th class="n">Balance</th></tr>' + s.entries.map(function (e) { return '<tr><td>' + fdate(e.date) + '</td><td>' + esc(cap(e.type)) + '<div class="tiny muted">' + esc(e.note) + '</div></td><td>' + esc(e.ref) + '</td><td class="n">' + (e.debit ? money(e.debit) : '') + '</td><td class="n">' + (e.credit ? money(e.credit) : '') + '</td><td class="n">' + money(e.balance) + '</td></tr>'; }).join('') + '</table></div></div>');
  }, failed);
};

/* =========================== APPROVALS =========================== */
VIEWS.approvals = function () {
  var jobs = [
    can('customer.approve') ? call('listCustomers', { status: 'PENDING' }) : Promise.resolve([]),
    can('payment.approve') ? call('listPayments', { status: 'PENDING' }) : Promise.resolve({ rows: [] }),
    can('adjustment.approve') ? call('listAdjustments', { status: 'PENDING' }) : Promise.resolve([]),
    can('expense.approve') ? call('listExpenses', { status: 'PENDING', month: 'ALL' }) : Promise.resolve({ rows: [] }),
    can('transport.approve') ? call('listTransport', { status: 'PENDING', month: 'ALL' }) : Promise.resolve({ rows: [] }),
    can('beat.manage') ? call('listPendingBeats') : Promise.resolve([]),
    can('note.post') ? call('listNotes', { status: 'DRAFT' }) : Promise.resolve({ rows: [] })
  ];
  Promise.all(jobs).then(function (r) {
    var outlets = r[0], pays = r[1].rows, adjs = r[2], exps = r[3].rows, trs = r[4].rows, beats = r[5], notes = r[6].rows;
    var total = outlets.length + pays.length + adjs.length + exps.length + trs.length + beats.length + notes.length;
    var html = head('Approvals', total ? num(total) + ' waiting · ' + companyLine() : 'Nothing waiting · ' + companyLine());
    if (can('customer.approve')) html += '<div class="section"><h3>New retail outlets</h3>' + (outlets.length ? '<div class="rows">' + outlets.map(function (c) { return '<div class="row static"><div class="m"><b>' + esc(c.customer_name) + '</b><span>' + esc([c.area, c.beat_name, c.salesman_name, c.mobile].filter(Boolean).join(' · ')) + '</span></div><div class="actions"><button class="btn sm ghost" onclick="go(\'customer\',{id:' + js(c.customer_id) + '})">View</button><button class="btn sm ok" onclick="approveOutlet(' + js(c.customer_id) + ',true)">Approve</button><button class="btn sm danger" onclick="approveOutlet(' + js(c.customer_id) + ',false)">Reject</button></div></div>'; }).join('') + '</div>' : emptyState('No outlets waiting', '')) + '</div>';
    if (can('beat.manage')) html += '<div class="section"><h3>New beats</h3>' + (beats.length ? '<div class="rows">' + beats.map(function (b) { return '<div class="row static"><div class="m"><b>' + esc(b.beat_name) + '</b><span>' + esc([b.salesman_name, b.territory, b.days.map(function (d) { return cap(d).slice(0, 3); }).join(' '), b.route_sequence, fdate(b.created_at)].filter(Boolean).join(' · ')) + '</span></div><div class="actions"><button class="btn sm ok" onclick="approveBeatUi(' + js(b.beat_id) + ',true)">Approve</button><button class="btn sm danger" onclick="approveBeatUi(' + js(b.beat_id) + ',false)">Reject</button></div></div>'; }).join('') + '</div>' : emptyState('No beats waiting', '')) + '</div>';
    if (can('note.post') && notes.length) html += '<div class="section"><h3>Credit / debit notes to post</h3><div class="rows">' + notes.map(function (n) { return '<div class="row static"><div class="m"><b>' + esc(n.customer_name) + ' · ' + money(n.note_value) + '</b><span>' + esc([cap(n.note_type) + ' note', n.invoice_number, cap(n.reason_type), fdate(n.note_date)].filter(Boolean).join(' · ')) + '</span></div><div class="actions"><button class="btn sm ghost" onclick="openNoteDetail(' + js(n.note_id) + ')">Open</button></div></div>'; }).join('') + '</div></div>';
    if (can('payment.approve')) html += '<div class="section"><h3>Collections to verify</h3>' + (pays.length ? '<div class="rows">' + pays.map(function (p) { return '<div class="row static"><div class="m"><b>' + esc(p.customer_name) + ' · ' + money(p.amount) + '</b><span>' + esc([fdate(p.payment_date), cap(p.mode), p.reference_no || p.cheque_no, 'by ' + p.received_by_name, cap(p.payment_nature)].filter(Boolean).join(' · ')) + '</span></div><div class="actions">' + (p.proof ? '<a class="btn sm ghost" target="_blank" href="' + attr(p.proof) + '">Proof</a>' : '') + '<button class="btn sm ok" onclick="approvePaymentUi(' + js(p.payment_id) + ',true)">Verify</button><button class="btn sm danger" onclick="approvePaymentUi(' + js(p.payment_id) + ',false)">Reject</button></div></div>'; }).join('') + '</div>' : emptyState('No collections waiting', '')) + '</div>';
    if (can('adjustment.approve')) html += '<div class="section"><h3>Invoice adjustments</h3>' + (adjs.length ? '<div class="rows">' + adjs.map(function (a) { return '<div class="row static"><div class="m"><b>' + esc(a.invoice_number) + ' · ' + money(a.amount) + '</b><span style="white-space:normal">' + esc(a.customer_name + ' · ' + cap(a.type) + ' – ' + a.reason + ' · by ' + a.requested_by) + '</span></div><div class="actions">' + (a.proof ? '<a class="btn sm ghost" target="_blank" href="' + attr(a.proof) + '">Proof</a>' : '') + '<button class="btn sm ok" onclick="approveAdjUi(' + js(a.adjustment_id) + ',true)">Approve</button><button class="btn sm danger" onclick="approveAdjUi(' + js(a.adjustment_id) + ',false)">Reject</button></div></div>'; }).join('') + '</div>' : emptyState('No adjustments waiting', '')) + '</div>';
    if (can('expense.approve')) html += '<div class="section"><h3>Expenses</h3>' + (exps.length ? '<div class="rows">' + exps.map(function (e) { return '<div class="row static"><div class="m"><b>' + esc(e.employee) + ' · ' + money(e.amount) + '</b><span style="white-space:normal">' + esc(fdate(e.date) + ' · ' + cap(e.category) + ' – ' + e.description) + '</span></div><div class="actions">' + (e.proof ? '<a class="btn sm ghost" target="_blank" href="' + attr(e.proof) + '">Bill</a>' : '') + '<button class="btn sm ok" onclick="approveExpenseUi(' + js(e.expense_id) + ',true)">Approve</button><button class="btn sm danger" onclick="approveExpenseUi(' + js(e.expense_id) + ',false)">Reject</button></div></div>'; }).join('') + '</div>' : emptyState('No expenses waiting', '')) + '</div>';
    if (can('transport.approve')) html += '<div class="section"><h3>Hired transport</h3>' + (trs.length ? '<div class="rows">' + trs.map(function (t) { return '<div class="row static"><div class="m"><b>' + esc(t.transporter) + ' · ' + money(t.total_cost) + '</b><span>' + esc([fdate(t.date), t.vehicle_number, t.route, t.order_ids].filter(Boolean).join(' · ')) + '</span></div><div class="actions">' + (t.proof ? '<a class="btn sm ghost" target="_blank" href="' + attr(t.proof) + '">Bill</a>' : '') + '<button class="btn sm ok" onclick="approveTransportUi(' + js(t.transport_id) + ',true)">Approve</button><button class="btn sm danger" onclick="approveTransportUi(' + js(t.transport_id) + ',false)">Reject</button></div></div>'; }).join('') + '</div>' : emptyState('No transport bills waiting', '')) + '</div>';
    setMain(html);
  }, failed);
};
function approveOutlet(id, ok) {
  if (ok) return act(null, '', function () { return call('approveCustomer', id, true, ''); }).then(refresh, swallow);
  askReason('Reject outlet', null, { danger: true, okLabel: 'Reject' }).then(function (r) { act(null, '', function () { return call('approveCustomer', id, false, r.reason); }).then(refresh, swallow); });
}
function approveBeatUi(id, ok) {
  if (ok) return act(null, '', function () { return call('approveBeat', id, true, ''); }).then(refresh, swallow);
  askReason('Reject beat', null, { danger: true, okLabel: 'Reject' }).then(function (r) { act(null, '', function () { return call('approveBeat', id, false, r.reason); }).then(refresh, swallow); });
}
function approveExpenseUi(id, ok) {
  if (ok) return act(null, '', function () { return call('approveExpense', id, true, ''); }).then(refresh, swallow);
  askReason('Reject expense', null, { danger: true, okLabel: 'Reject' }).then(function (r) { act(null, '', function () { return call('approveExpense', id, false, r.reason); }).then(refresh, swallow); });
}

function openUserForm(id) {

      '<div class="grid2"><label class="field"><span>Mobile <em>*</em></span><input name="mobile" inputmode="tel" value="' + attr(u.mobile) + '"></label><label class="field"><span>Email</span><input name="email" type="email" value="' + attr(u.email) + '"></label></div>' +

      '<label class="field"><span>Primary company <em>*</em></span><select name="company_id">' + opts(cs.filter(function (c) { return c.status === 'ACTIVE'; }), u.company_id || (S.boot.company || {}).company_id, undefined, 'company_id', 'company_name') + '</select><small>More companies: use "Companies".</small></label></div>' +

/* ----------------------------- note form ----------------------------- */
var NF = null;

};
function noteQtyBased() { return NF.type === 'CREDIT' && L('QTY_CREDIT').indexOf(NF.reason_type) >= 0; }
function renderNoteForm() {
  var d = NF.d, credit = NF.type === 'CREDIT', qty = noteQtyBased();
  var exLines = {}; if (NF.existing) NF.existing.lines.forEach(function (l) { exLines[l.invoice_line_id + '|' + l.stock_bucket] = l; exLines[l.invoice_line_id] = l; });

    html += '<div class="section"><h3>' + (qty ? 'Quantity returned / not accepted' : 'Amount per product (incl. GST)') + '</h3><div class="tbl-wrap"><table class="tbl"><tr><th>Product</th><th class="n">Invoiced</th><th class="n">' + (qty ? 'Already credited' : 'Line value') + '</th><th class="n">' + (qty ? 'Qty (pcs)' : 'Amount ₹') + '</th>' + (qty ? '<th>Stock</th>' : '') + '</tr>' +
      d.lines.map(function (l, i) {

        return '<tr><td>' + esc(l.product_name) + '<div class="tiny muted">' + esc(l.hsn) + ' · ' + l.gst_rate + '% · ' + money(l.rate_incl) + '/pc</div></td><td class="n">' + num(l.qty) + '</td><td class="n">' + (qty ? num(l.credited_qty) : money(l.gross)) + '</td>' +
          '<td class="n"><input type="number" class="nfIn" data-line="' + attr(l.line_id) + '" min="0" ' + (qty ? 'step="1" max="' + left + '"' : 'step="0.01"' + (credit ? ' max="' + left + '"' : '')) + ' value="' + attr(qty ? (e.qty || '') : (e.gross || '')) + '" oninput="noteTotal()"></td>' +
          (qty ? '<td><select class="nfBk" data-line="' + attr(l.line_id) + '">' + opts([{ value: 'SALEABLE', label: 'Back to saleable' }, { value: 'DAMAGED', label: 'Damaged' }, { value: 'NONE', label: 'Not returned' }], e.stock_bucket || (['DAMAGED IN TRANSIT', 'EXPIRY RETURN'].indexOf(NF.reason_type) >= 0 ? 'DAMAGED' : 'SALEABLE')) + '</select></td>' : '') + '</tr>';
      }).join('') + '</table></div>' + (!qty && credit ? '<div class="actions" style="margin-top:8px"><label class="small">Spread a total across lines <input type="number" id="nfSpread" step="0.01" style="width:120px;min-height:36px"></label><button class="btn sm ghost" onclick="spreadNote()">Spread</button></div>' : '') + '</div>';
    html += '<div class="total-bar"><span>' + (credit ? 'Credit note value' : 'Debit note value') + '</span><span class="v" id="nfTotal">₹0.00</span></div>';

function noteLinesFromForm() {

function noteTotal() {

  document.querySelectorAll('.nfIn').forEach(function (i) { var l = NF.d.lines.filter(function (x) { return x.line_id === i.dataset.line; })[0]; var v = Number(i.value) || 0; t += qty ? v * l.rate_incl : v; });

function spreadNote() {

    document.querySelectorAll('#pvMode button').forEach(function (b) { b.onclick = function () { st.mode = b.getAttribute('data-m'); render(); }; });
    if ($('pvEwSave')) $('pvEwSave').onclick = function () { act(this, 'Saving…', function () { return call('saveEwayBill', id, $('pvEw').value, $('pvEwD').value); }).then(function () { closeModal(); printDoc(type, id, st.mode); }, swallow); };
    if ($('pvLedger')) $('pvLedger').onchange = function () { st.ledger = this.checked; render(); };
    $('pvPrint').onclick = function () { render(); window.print(); };
    render();
    if ($('pdfDrive')) $('pdfDrive').onclick = function () { act(this, 'Saving…', function () { return call('saveDocumentPdf', type, id, st.mode); }).then(function (r) { if (r && r.url) window.open(r.url, '_blank'); }, swallow); };
  }, showErr);
}
</script>

<script>
/* =========================== STOCK & PURCHASES =========================== */
VIEWS.stock = function (p) {
  p = Object.assign({ tab: 'summary' }, p || {}); S.params = p;
  var tabs = [['summary', 'Stock'], ['purchases', 'Purchases']];
  if (can('stock.adjust')) tabs.push(['opening', 'Opening stock']);
  var tabHtml = '<div class="tabs">' + tabs.map(function (t) { return '<button class="' + (t[0] === p.tab ? 'on' : '') + '" onclick="go(\'stock\',{tab:\'' + t[0] + '\'},{replace:true})">' + t[1] + '</button>'; }).join('') + '</div>';
  var right = '<div class="actions">' + (can('purchase.manage') ? '<button class="btn sm" onclick="go(\'purchaseForm\',{})">Purchase bill</button><button class="btn sm ghost" onclick="go(\'purchaseForm\',{doc_type:\'PURCHASE_RETURN\'})">Return to principal</button>' : '') + (can('stock.adjust') ? '<button class="btn sm ghost" onclick="openAdjust(\'\')">Adjust stock</button>' : '') + '</div>';
  if (p.tab === 'summary') {
    call('getStockSummary', { from: p.from || '', to: p.to || '' }).then(function (r) {
      S.cache.stockRows = r.rows;
      setMain(head('Stock & purchases', companyLine(), right) + tabHtml +
        (!r.tracked ? '<div class="note warn" style="margin-bottom:12px">Stock is not started for this company. Enter <b>Opening stock</b> first (Admin), then record each purchase bill. Supply confirmation checks this stock.</div>' : '') +
        '<div class="filters" id="skF"><label class="field"><span>From</span><input type="date" name="from" value="' + attr(r.from) + '"></label><label class="field"><span>To</span><input type="date" name="to" value="' + attr(r.to) + '"></label><div class="actions" style="align-items:flex-end"><button class="btn" onclick="var v=formVals(\'skF\');v.tab=\'summary\';go(\'stock\',v,{replace:true})">Apply</button></div><div class="field wide"><span>Search</span>' + searchBox('skQ', 'Product', 'filterStock()') + '</div></div>' +
        '<div class="kpis">' + kpi('Stock value', money0(r.total_value), 'at last purchase cost', 'sales') + kpi('Products', num(r.rows.length), '') + kpi('Out of stock', num(r.low), 'available 0 or less', r.low ? 'due' : '') + '</div>' +
        '<div class="section"><div class="tbl-wrap"><table class="tbl" id="skTbl"></table></div><p class="tiny muted" style="margin:8px 0 0">Reserved = confirmed for supply but not yet invoiced. Available = closing − reserved. Tap a product for its stock ledger.</p></div>');
      filterStock();
    }, failed);
    return;
  }
  if (p.tab === 'purchases') {
    var f = { from: p.from || monthStart(), to: p.to || today() };
    call('listPurchases', f).then(function (r) {
      setMain(head('Stock & purchases', companyLine(), right) + tabHtml +
        '<div class="filters" id="puF"><label class="field"><span>From</span><input type="date" name="from" value="' + attr(f.from) + '"></label><label class="field"><span>To</span><input type="date" name="to" value="' + attr(f.to) + '"></label><div class="actions" style="align-items:flex-end"><button class="btn" onclick="var v=formVals(\'puF\');v.tab=\'purchases\';go(\'stock\',v,{replace:true})">Apply</button></div></div>' +
        '<div class="kpis">' + kpi('Net purchases', money0(r.total), 'bills − returns', 'order') + kpi('Taxable', money0(r.taxable), '') + kpi('Input GST', money0(r.tax), 'for GSTR-3B', 'sales') + '</div>' +
        '<div class="section">' + (r.rows.length ? '<div class="rows">' + r.rows.map(function (h) {
          return '<button class="row" onclick="openPurchase(' + js(h.purchase_id) + ')"><div class="m"><b>' + esc(h.bill_number) + ' · ' + esc(h.supplier_name) + '</b><span>' + fdate(h.bill_date) + ' · ' + (h.doc_type === 'PURCHASE' ? 'Purchase' : 'Return to principal') + ' · taxable ' + money(h.taxable_value) + ' · GST ' + money(h.cgst + h.sgst + h.igst) + (h.doc_type === 'PURCHASE' && h.status !== 'CANCELLED' ? ' · due ' + fdate(h.due_date) + ' · ' + (h.balance > 0 ? 'balance ' + money(h.balance) : 'paid') : '') + (h.itc_eligible === 'NO' ? ' · ITC not eligible' : '') + '</span></div><div class="r"><b>' + (h.doc_type === 'PURCHASE' ? '' : '−') + money(h.total_value) + '</b>' + chip(h.status === 'POSTED' ? 'APPROVED' : h.status, cap(h.status)) + '</div></button>';
        }).join('') + '</div>' : emptyState('No purchase bills in this period', 'Record every bill from the principal so stock and input GST stay correct.')) + '</div>');
    }, failed);
    return;
  }
  call('getPurchaseFormData').then(function (d) {
    var started = {}; Object.keys(d.on_hand).forEach(function (k) { started[k] = true; });
    setMain(head('Stock & purchases', companyLine(), right) + tabHtml + '<div class="note small" style="margin-bottom:12px">Enter the physical stock on the day you start using the app. Each product can have opening stock once; later corrections are stock adjustments (audited).</div>' +
      '<div class="section"><label class="field" style="max-width:240px"><span>Opening stock date</span><input type="date" id="opDate" max="' + today() + '" value="' + today() + '"></label><div class="tbl-wrap" style="margin-top:10px"><table class="tbl"><tr><th>Product</th><th class="n">Saleable pcs</th><th class="n">Damaged pcs</th><th class="n">Unit cost ₹ (excl. GST)</th></tr>' +
      d.products.map(function (pr) { return started[pr.sku_id] ? '<tr><td>' + esc(pr.label) + '</td><td colspan="3" class="muted">Already started – ' + num(d.on_hand[pr.sku_id].SALEABLE) + ' pcs in stock</td></tr>' : '<tr><td>' + esc(pr.label) + '</td><td class="n"><input type="number" min="0" step="1" class="opQ" data-sku="' + attr(pr.sku_id) + '"></td><td class="n"><input type="number" min="0" step="1" class="opD" data-sku="' + attr(pr.sku_id) + '"></td><td class="n"><input type="number" min="0" step="0.01" class="opC" data-sku="' + attr(pr.sku_id) + '" value="' + attr(pr.distributor_price || '') + '"></td></tr>'; }).join('') +
      '</table></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="saveOpening(this)">Save opening stock</button></div></div>');
  }, failed);
};
function filterStock() {
  var q = val('skQ').toLowerCase(), rows = (S.cache.stockRows || []).filter(function (r) { return !q || r.product.toLowerCase().indexOf(q) >= 0; });
  $('skTbl').innerHTML = '<tr><th>Product</th><th class="n">Opening</th><th class="n">In</th><th class="n">Sold</th><th class="n">Out</th><th class="n">Closing</th><th class="n">Reserved</th><th class="n">Available</th><th class="n">Damaged</th><th class="n">Value</th></tr>' + rows.map(function (r) {
    return '<tr style="cursor:pointer" onclick="openLedger(' + js(r.sku_id) + ')"><td>' + esc(r.product) + (r.case_pack ? '<div class="tiny muted">' + r.cases + ' cases</div>' : '') + '</td><td class="n">' + num(r.opening) + '</td><td class="n">' + num(r.purchase + r.sales_return + r.adj_in) + '</td><td class="n">' + num(r.sale) + '</td><td class="n">' + num(r.purchase_return + r.adj_out) + '</td><td class="n"><b>' + num(r.closing) + '</b></td><td class="n">' + num(r.reserved) + '</td><td class="n" style="' + (r.available <= 0 ? 'color:var(--red);font-weight:700' : '') + '">' + num(r.available) + '</td><td class="n">' + num(r.damaged) + '</td><td class="n">' + money0(r.value) + '</td></tr>';
  }).join('');
}
function openLedger(sku) {
  call('getStockLedger', sku, monthStart(), today()).then(function (l) {
    openModal('<h3>' + esc(l.product) + '</h3><div class="small muted" style="margin-bottom:8px">This month · opening ' + num(l.opening) + ' · closing ' + num(l.closing) + ' pcs</div><div class="tbl-wrap"><table class="tbl"><tr><th>Date</th><th>Movement</th><th class="n">In</th><th class="n">Out</th><th class="n">Balance</th><th>Details</th></tr>' +
      l.rows.map(function (r) { return '<tr><td>' + fdate(r.date) + '</td><td>' + esc(cap(r.movement)) + '</td><td class="n">' + (r.qty_in || '') + '</td><td class="n">' + (r.qty_out || '') + '</td><td class="n">' + num(r.balance) + '</td><td class="tiny">' + esc(r.remarks) + '</td></tr>'; }).join('') + '</table></div>' +
      '<div class="actions end" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button>' + (can('stock.adjust') ? '<button class="btn" onclick="closeModal();openAdjust(' + js(sku).replace(/"/g, '&quot;') + ')">Adjust</button>' : '') + '</div>');
  }, showErr);
}
function saveOpening(btn) {
  var rows = [];
  document.querySelectorAll('.opQ').forEach(function (i) { var sku = i.dataset.sku, d = document.querySelector('.opD[data-sku="' + sku + '"]'), c = document.querySelector('.opC[data-sku="' + sku + '"]'); if (Number(i.value) || Number(d.value)) rows.push({ sku_id: sku, qty: Number(i.value) || 0, damaged_qty: Number(d.value) || 0, unit_cost: Number(c.value) || 0 }); });
  act(btn, 'Saving…', function () { return call('saveOpeningStock', val('opDate'), rows); }).then(function () { go('stock', { tab: 'summary' }, { replace: true }); }, swallow);
}
function openAdjust(sku) {
  call('listProducts', false).then(function (ps) {
    openModal('<h3>Adjust stock</h3><div class="form" id="adF"><label class="field"><span>Product <em>*</em></span><select name="sku_id">' + opts(ps, sku, 'Select product', 'sku_id', 'label') + '</select></label>' +
      '<div class="grid2"><label class="field"><span>Quantity (pcs) <em>*</em></span><input name="qty" type="number" step="1" placeholder="−10 removes, 10 adds"></label><label class="field"><span>Stock</span><select name="bucket">' + opts([{ value: 'SALEABLE', label: 'Saleable' }, { value: 'DAMAGED', label: 'Damaged' }], 'SALEABLE') + '</select></label></div>' +
      '<label class="field"><span>Reason <em>*</em></span><select name="reason">' + opts(L('STOCK_ADJUST'), '', 'Select reason') + '</select></label><label class="check"><input type="checkbox" name="move_to_damaged"> Move the removed saleable pcs to damaged stock (expiry / breakage)</label>' +
      '<label class="field"><span>Remarks</span><input name="remarks"></label><div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="adOk">Save adjustment</button></div></div>');
    $('adOk').onclick = function () { var v = formVals('adF'); act(this, 'Saving…', function () { return call('adjustStock', v); }).then(function () { closeModal(); refresh(); }, swallow); };
  }, showErr);
}
function openPurchase(id) {
  call('getPurchase', id).then(function (d) {
    var h = d.header;
    openModal('<h3>' + (h.doc_type === 'PURCHASE' ? 'Purchase bill ' : 'Return ') + esc(h.bill_number) + '</h3><dl class="kv" style="margin-bottom:10px"><dt>Supplier</dt><dd>' + esc(h.supplier_name) + (h.supplier_gstin ? ' · ' + esc(h.supplier_gstin) : '') + '</dd><dt>Bill date</dt><dd>' + fdate(h.bill_date) + ' · received ' + fdate(h.received_date) + '</dd>' + (h.doc_type === 'PURCHASE' ? '<dt>Payment</dt><dd>Due ' + fdate(h.due_date) + ' · ' + (h.balance > 0 ? 'balance <b>' + money(h.balance) + '</b>' : 'fully paid / adjusted') + (can('payable.view') ? ' · <a href="#" onclick="event.preventDefault();closeModal();go(\'payables\')">Payables</a>' : '') + '</dd>' : (h.pay_status ? '<dt>Credit</dt><dd>' + esc(cap(h.pay_status)) + '</dd>' : '')) + '<dt>ITC</dt><dd>' + esc(h.itc_eligible) + '</dd>' + (h.cancel_reason ? '<dt>Cancelled</dt><dd>' + esc(h.cancel_reason) + '</dd>' : '') + '</dl>' +
      '<div class="tbl-wrap"><table class="tbl"><tr><th>Product</th><th class="n">Qty</th><th class="n">Rate</th><th class="n">GST</th><th class="n">Taxable</th><th class="n">Tax</th><th class="n">Total</th></tr>' + d.lines.map(function (l) { return '<tr><td>' + esc(l.product_name) + (l.batch_no ? '<div class="tiny muted">Batch ' + esc(l.batch_no) + (l.expiry_date ? ' · exp ' + fdate(l.expiry_date) : '') + '</div>' : '') + '</td><td class="n">' + num(l.qty) + '</td><td class="n">' + money(l.rate) + '</td><td class="n">' + l.gst_rate + '%</td><td class="n">' + money(l.taxable) + '</td><td class="n">' + money(l.cgst + l.sgst + l.igst) + '</td><td class="n">' + money(l.total) + '</td></tr>'; }).join('') + '</table></div>' +
      '<div class="total-bar"><span>' + chip(h.status === 'POSTED' ? 'APPROVED' : h.status, cap(h.status)) + '</span><span class="v">' + money(h.total_value) + '</span></div><div class="actions end">' + (h.proof ? '<a class="btn ghost" target="_blank" href="' + attr(h.proof) + '">Bill copy</a>' : '') + '<button class="btn ghost" onclick="closeModal()">Close</button>' +
      (can('purchase.cancel') && h.status === 'POSTED' ? '<button class="btn danger" id="puCancel">Cancel entry</button>' : '') + '</div>');
    if ($('puCancel')) $('puCancel').onclick = function () { closeModal(); askReason('Cancel purchase entry', null, { danger: true, okLabel: 'Cancel entry' }).then(function (r) { act(null, '', function () { return call('cancelPurchase', id, r.reason); }).then(refresh, swallow); }); };
  }, showErr);
}

var PF = null;
VIEWS.purchaseForm = function (p) {
  call('getPurchaseFormData').then(function (d) {
    PF = { d: d, type: (p && p.doc_type) || 'PURCHASE', lines: [] };
    var ret = PF.type === 'PURCHASE_RETURN';
    var html = head(ret ? 'Return to principal' : 'Purchase bill', companyLine() + ' · ' + (ret ? 'stock goes out, input GST reverses' : 'stock comes in, input GST for GSTR-3B'));
    html += '<div class="section"><div class="form" id="pfH"><div class="grid2"><label class="field"><span>Supplier <em>*</em></span><input name="supplier_name" value="' + attr(d.supplier_name) + '"></label><label class="field"><span>Supplier GSTIN</span><input name="supplier_gstin" style="text-transform:uppercase" value="' + attr(d.supplier_gstin) + '"></label></div>' +
      '<div class="grid3"><label class="field"><span>' + (ret ? 'Return / debit note no.' : 'Bill no.') + ' <em>*</em></span><input name="bill_number" style="text-transform:uppercase"></label><label class="field"><span>Bill date <em>*</em></span><input type="date" name="bill_date" max="' + today() + '" value="' + today() + '"></label><label class="field"><span>' + (ret ? 'Sent on' : 'Received on') + '</span><input type="date" name="received_date" max="' + today() + '" value="' + today() + '"></label></div>' +
      '<div class="grid2"><label class="field"><span>Supplier state</span><select name="supplier_state_code" onchange="pfCalc()">' + opts(d.states, d.supplier_state_code || d.seller_state_code) + '</select></label><div class="field"><span>Options</span><label class="check"><input type="checkbox" id="pfItc" checked> Input tax credit eligible</label></div></div></div></div>';
    html += '<div class="section"><div class="section-head"><h3>Products</h3><span class="muted small">Rate per piece <b>before GST</b> – GST is added on top</span></div><div class="actions" style="margin-bottom:8px"><select id="pfAdd" style="max-width:420px">' + opts(d.products, '', 'Add product…', 'sku_id', 'label') + '</select><button class="btn sm" onclick="pfAddLine()">Add</button></div><div id="pfLines"></div></div>';
    html += '<div class="section">' + fileField('pfProof', 'Bill copy (photo / PDF)') + '<label class="field" style="margin-top:10px"><span>Remarks</span><input id="pfRem"></label></div>';
    html += '<div class="total-bar"><span id="pfTax"></span><span class="v" id="pfTot">₹0.00</span></div><div class="sticky-actions"><button class="btn ghost" onclick="back()">Cancel</button><button class="btn" style="flex:1" onclick="savePurchase(this)">Save ' + (ret ? 'return' : 'purchase') + '</button></div>';
    setMain(html); pfRender();
  }, failed);
};
function pfAddLine() {
  var sku = val('pfAdd'); if (!sku) return;
  if (PF.lines.some(function (l) { return l.sku_id === sku; })) return toast('Already added.');
  var pr = PF.d.products.filter(function (x) { return x.sku_id === sku; })[0];
  PF.lines.push({ sku_id: sku, label: pr.label, qty: pr.case_pack || '', rate: pr.last_rate || '', gst_rate: pr.gst, hsn: pr.hsn || '', hsn_old: pr.hsn || '', batch_no: '', expiry_date: '', bucket: 'DAMAGED' });
  $('pfAdd').value = ''; pfRender();
}
function pfRender() {
  var ret = PF.type === 'PURCHASE_RETURN';
  $('pfLines').innerHTML = PF.lines.length ? PF.lines.map(function (l, i) {
    return '<div class="line"><div class="top"><b>' + esc(l.label) + '</b><button class="btn sm ghost" onclick="PF.lines.splice(' + i + ',1);pfRender()">Remove</button></div><div class="grid3" style="margin-top:8px;grid-template-columns:repeat(2,1fr)">' +
      '<label class="field"><span>Qty (pcs)</span><input type="number" step="1" min="1" value="' + attr(l.qty) + '" oninput="PF.lines[' + i + '].qty=this.value;pfCalc()"></label><label class="field"><span>Rate before GST ₹</span><input type="number" step="0.01" value="' + attr(l.rate) + '" oninput="PF.lines[' + i + '].rate=this.value;pfCalc()"></label>' +
      '<label class="field"><span>HSN code</span><input inputmode="numeric" maxlength="8" value="' + attr(l.hsn) + '" oninput="PF.lines[' + i + '].hsn=this.value.replace(/\\D/g,\'\');pfHsn(' + i + ')"></label><label class="field"><span>GST %</span><select onchange="PF.lines[' + i + '].gst_rate=Number(this.value);pfCalc()">' + opts([0, 5, 12, 18, 28, 40].map(function (g) { return { value: g, label: g + '%' }; }), l.gst_rate) + '</select></label></div>' +
      (ret ? '<label class="field" style="margin-top:8px"><span>Take from</span><select onchange="PF.lines[' + i + '].bucket=this.value">' + opts([{ value: 'DAMAGED', label: 'Damaged / expired stock' }, { value: 'SALEABLE', label: 'Saleable stock' }], l.bucket) + '</select></label>'
        : '<div class="grid2" style="margin-top:8px"><label class="field"><span>Batch</span><input value="' + attr(l.batch_no) + '" oninput="PF.lines[' + i + '].batch_no=this.value"></label><label class="field"><span>Expiry</span><input type="date" value="' + attr(l.expiry_date) + '" oninput="PF.lines[' + i + '].expiry_date=this.value"></label></div>') +
      '<div class="small muted" id="pfL' + i + '" style="margin-top:6px"></div></div>';
  }).join('') : '<div class="muted small">Add each product from the bill.</div>';
  pfCalc();
}
function pfHsn(i) { var l = PF.lines[i], el = $('pfL' + i); if (el && l.hsn !== l.hsn_old) el.dataset.hsn = '1'; pfCalc(); }
function pfCalc() {
  var sel = document.querySelector('[name=supplier_state_code]'), inter = !!sel && sel.value !== PF.d.seller_state_code, t = { tx: 0, tax: 0, tot: 0 };
  PF.lines.forEach(function (l, i) {
    var amt = (Number(l.qty) || 0) * (Number(l.rate) || 0), r = Number(l.gst_rate) || 0;
    var taxable = amt, tax = taxable * r / 100;
    t.tx += taxable; t.tax += tax; t.tot += taxable + tax;
    var el = $('pfL' + i); if (el) el.textContent = 'Taxable ' + money(taxable) + ' + ' + (inter ? 'IGST ' : 'CGST/SGST ') + money(tax) + ' = ' + money(taxable + tax) + (l.hsn && l.hsn !== l.hsn_old ? ' · HSN changes ' + (l.hsn_old || '(blank)') + ' → ' + l.hsn + ' in Product Master' : '');
  });
  if ($('pfTot')) { $('pfTot').textContent = money(Math.round(t.tot)); $('pfTax').textContent = 'Taxable ' + money(t.tx) + ' · GST ' + money(t.tax); }
}
function savePurchase(btn) {
  var h = formVals('pfH');
  var payload = Object.assign(h, { doc_type: PF.type, itc_eligible: $('pfItc').checked, remarks: val('pfRem'),
    lines: PF.lines.map(function (l) { return { sku_id: l.sku_id, qty: Number(l.qty), rate: Number(l.rate), gst_rate: l.gst_rate, hsn: l.hsn, batch_no: l.batch_no, expiry_date: l.expiry_date, bucket: l.bucket }; }) });
  act(btn, 'Saving…', function () { return readFile('pfProof').then(function (f) { if (f) { payload.proof_base64 = f.data; payload.proof_file_name = f.name; payload.proof_mime_type = f.mime; } return call('recordPurchase', payload); }); })
    .then(function () { go('stock', { tab: 'purchases' }, { replace: true }); }, swallow);
}
</script>

<script>
/* =========================== REPORTS & GST =========================== */
VIEWS.reports = function (p) {
  p = p || {};
  call('listReports').then(function (r) {
    S.cache.reportDefs = r;
    var groups = {};
    r.reports.forEach(function (x) { (groups[x.group] = groups[x.group] || []).push(x); });
    var html = head('Reports & GST', companyLine() + ' · download any report as Excel');
    Object.keys(groups).forEach(function (g) {
      html += '<div class="section"><h3>' + esc(g) + '</h3><div class="rows">' + groups[g].map(function (x) { return '<button class="row" onclick="go(\'report\',{id:' + js(x.id) + '})"><div class="m"><b>' + esc(x.name) + '</b><span>' + esc(reportHint(x.id)) + '</span></div></button>'; }).join('') + '</div></div>';
    });
    setMain(html);
  }, failed);
};
function reportHint(id) {

function cellFmt(v, type) {
  if (v === '' || v === null || v === undefined) return '';
  if (type === 'money') return typeof v === 'number' ? m2(v) : esc(v);
  if (type === 'num') return typeof v === 'number' ? num(v) : esc(v);
  if (type === 'date') return fdate(v);

}
function drawReport() {
  var r = S.cache.report, i = S.cache.reportSheet || 0, sh = r.sheets[i];
  var html = '<div class="section"><div class="section-head"><h3>' + esc(r.title) + '</h3><div class="actions"><button class="btn sm" onclick="downloadReport(this)">Download Excel</button>' + (!isSales() ? '<button class="btn sm ghost" onclick="saveReportDrive(this)">Save to Drive</button>' : '') + '</div></div>' +
    '<div class="small muted" style="margin-bottom:8px">' + esc(r.company) + ' · ' + esc(r.period) + (r.subtitle ? ' · ' + esc(r.subtitle) : '') + '</div>';

  html += sh.rows.length ? '<div class="tbl-wrap" style="max-height:65vh;overflow:auto"><table class="tbl"><tr>' + sh.columns.map(function (c) { return '<th' + (c.type === 'money' || c.type === 'num' ? ' class="n"' : '') + '>' + esc(c.label) + '</th>'; }).join('') + '</tr>' +
    sh.rows.slice(0, 500).map(function (row) { return '<tr>' + sh.columns.map(function (c) { return '<td' + (c.type === 'money' || c.type === 'num' ? ' class="n"' : '') + '>' + cellFmt(row[c.key], c.type) + '</td>'; }).join('') + '</tr>'; }).join('') +
    (sh.totals ? '<tr>' + sh.columns.map(function (c, k) { return '<td' + (c.type === 'money' || c.type === 'num' ? ' class="n"' : '') + '><b>' + (k === 0 ? 'Total' : (sh.totals[c.key] !== undefined ? cellFmt(sh.totals[c.key], c.type) : '')) + '</b></td>'; }).join('') + '</tr>' : '') + '</table></div>' +
    (sh.rows.length > 500 ? '<div class="tiny muted" style="margin-top:6px">Showing 500 of ' + sh.rows.length + ' rows on screen – the Excel file has all rows.</div>' : '')
    : emptyState('No data for this period', '');
  html += '<div class="tiny muted" style="margin-top:8px">Generated ' + esc(r.generated) + '</div></div>';
  $('rpOut').innerHTML = html;
}
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function () { resolve(window.XLSX); };
    s.onerror = function () { reject(new Error('Could not load the Excel library. Check the internet connection, or use "Save to Drive".')); };
    document.head.appendChild(s);
  });
}
function reportWorkbook(XLSX, r) {
  var wb = XLSX.utils.book_new(), gst = r.id === 'gstr1' || r.id === 'hsn_summary' || !!r.plain;
  r.sheets.forEach(function (sh) {
    var aoa = gst ? [] : [[r.title], [r.company + ' · ' + r.period], []];
    aoa.push(sh.columns.map(function (c) { return c.label; }));
    sh.rows.forEach(function (row) { aoa.push(sh.columns.map(function (c) { var v = row[c.key]; return v === undefined || v === null ? '' : v; })); });
    if (sh.totals && !gst) aoa.push(sh.columns.map(function (c, k) { return k === 0 ? 'Total' : (sh.totals[c.key] === undefined ? '' : sh.totals[c.key]); }));
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = sh.columns.map(function (c) { return { wch: Math.min(40, Math.max(10, c.label.length + 2)) }; });
    XLSX.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31));
  });
  return wb;
}
function downloadReport(btn) {
  var r = S.cache.report;
  act(btn, 'Preparing…', function () {
    return loadSheetJs().then(function (XLSX) {
      var name = (r.title + ' ' + r.company + ' ' + r.period).replace(/[^\w\- ]+/g, ' ').replace(/\s+/g, '_').slice(0, 90) + '.xlsx';
      XLSX.writeFile(reportWorkbook(XLSX, r), name);
      return { message: '✓ ' + name + ' downloaded.' };
    });
  }).catch(swallow);
}
function saveReportDrive(btn) {
  act(btn, 'Saving…', function () { return call('saveReportToDrive', S.cache.report.id, S.cache.reportParams); }).then(function (r) { if (r && r.url) window.open(r.url, '_blank'); }, swallow);
}
</script>

<script>
/* Shared by the staff app (delivery screen) and the customer page: UPI payment QR with the exact amount. */
var QR_LIB_URLS = ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'];
function loadQrLib() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (window._qrLoading) return window._qrLoading;
  window._qrLoading = new Promise(function (resolve, reject) {
    var i = 0;
    (function next() {
      if (i >= QR_LIB_URLS.length) { window._qrLoading = null; return reject(new Error('QR code could not load (no internet?). Ask the customer to pay to the UPI ID shown.')); }
      var s = document.createElement('script'); s.src = QR_LIB_URLS[i++];
      s.onload = function () { window.qrcode ? resolve(window.qrcode) : next(); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
  return window._qrLoading;
}
/** upi://pay link – opens GPay / PhonePe / Paytm with payee, amount and a note (invoice number) filled in. */
function upiLink(vpa, name, amount, note) {
  var q = ['pa=' + encodeURIComponent(vpa), 'pn=' + encodeURIComponent(name || ''), 'cu=INR'];
  if (Number(amount) > 0) q.push('am=' + Number(amount).toFixed(2));
  if (note) q.push('tn=' + encodeURIComponent(String(note).slice(0, 60)));
  return 'upi://pay?' + q.join('&');
}
/** Draws the QR into the element with the given id. */
function drawUpiQr(elId, vpa, name, amount, note) {
  var el = document.getElementById(elId);
  if (!el) return;
  if (!vpa) { el.innerHTML = '<div class="note warn small">UPI ID is not set. Admin → Direct (D2C) → Settings.</div>'; return; }
  el.innerHTML = '<div class="small muted">Loading QR…</div>';
  loadQrLib().then(function (qrcode) {
    var q = qrcode(0, 'M'); q.addData(upiLink(vpa, name, amount, note)); q.make();
    el.innerHTML = '<div class="qr-box">' + q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }) + '</div>';
  }, function (e) { el.innerHTML = '<div class="note warn small">' + esc(e.message) + '</div>'; });
}
</script>

/* Excel uploaded back by the company */
var D2C_IMPORT_MAP = { 'invoice no': 'invoice_no', 'sku': 'sku', 'delivered (yes/no)': 'delivered', 'delivered': 'delivered', 'delivered qty': 'delivered_qty', 'reason (if not delivered)': 'reason', 'reason': 'reason',
  'amount paid': 'amount_paid', 'pay mode (upi/cash)': 'pay_mode', 'pay mode': 'pay_mode', 'upi ref / utr': 'upi_ref', 'utr': 'upi_ref' };
function sheetRows(file, sheetName, mustHave, map) {
  return loadSheetJs().then(function (XLSX) {
    return file.arrayBuffer().then(function (buf) {
      var wb = XLSX.read(buf, { type: 'array' }), ws = wb.Sheets[sheetName] || wb.Sheets[wb.SheetNames[0]];
      var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true });
      var hi = aoa.findIndex(function (r) { return r.some(function (c) { return String(c).trim().toLowerCase() === mustHave; }); });
      if (hi < 0) throw new Error('Could not find the "' + mustHave + '" column. Use the file downloaded from this app.');
      var keys = aoa[hi].map(function (c) { return map[String(c).trim().toLowerCase()] || ''; });
      return aoa.slice(hi + 1).map(function (r, i) { var o = { row: hi + i + 2 }; keys.forEach(function (k, j) { if (k) o[k] = String(r[j] == null ? '' : r[j]).trim(); }); return o; })
        .filter(function (o) { return Object.keys(o).some(function (k) { return k !== 'row' && o[k]; }); });
    });
  });
}
function d2cUploadDeliveries(date) {

    '<div class="field" style="margin-top:10px"><span>Excel file</span><input type="file" id="upX" accept=".xlsx,.xls,.csv"></div><div id="upRes"></div><div class="actions end" style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" id="upOk">Upload</button></div>');
  $('upOk').onclick = function () {

    act(this, 'Reading…', function () { return sheetRows(f, 'Delivery list', 'invoice no', D2C_IMPORT_MAP).then(function (rows) { return call('d2cImportDeliveries', date, rows); }); }).then(function (r) {

  else h += '<div class="grid2" style="margin-top:6px"><label class="field"><span>Start</span><input type="date" id="sfS" min="' + SF.first + '" value="' + SF.first + '"></label><label class="field"><span>End (optional)</span><input type="date" id="sfE" min="' + SF.first + '"></label></div>';

/** Month calendar where the user taps several dates (dates before st.first are disabled). */
function multiCal(st, redraw) {
  var y = Number(st.month.slice(0, 4)), m = Number(st.month.slice(5, 7)) - 1, first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), pad = (first.getDay() + 6) % 7;
  var prev = m === 0 ? (y - 1) + '-12' : y + '-' + String(m).padStart(2, '0'), next = m === 11 ? (y + 1) + '-01' : y + '-' + String(m + 2).padStart(2, '0');
  var h = '<div class="cal-head"><button type="button" class="btn sm ghost" onclick="SFX.month=' + js(prev) + ';' + redraw + '">‹</button><b>' + first.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }) + '</b><button type="button" class="btn sm ghost" onclick="SFX.month=' + js(next) + ';' + redraw + '">›</button></div><div class="cal">' +
    ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (x) { return '<div class="h">' + x + '</div>'; }).join('');
  for (var i = 0; i < pad; i++) h += '<div></div>';
  for (var dd = 1; dd <= days; dd++) {
    var k = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(dd).padStart(2, '0'), okd = k >= st.first, sel = st.dates.indexOf(k) >= 0;
    h += '<button type="button" class="' + (okd ? 'ok' : '') + (sel ? ' sel' : '') + '"' + (okd ? ' onclick="SFX.toggle(' + js(k) + ');' + redraw + '"' : ' disabled') + '>' + dd + (sel ? '<small>✓</small>' : '') + '</button>';
  }
  window.SFX = { set month(v) { st.month = v; }, toggle: function (k) { var i = st.dates.indexOf(k); if (i >= 0) st.dates.splice(i, 1); else st.dates.push(k); st.dates.sort(); } };
  return h + '</div>';
}

      (r.items.length ? '<div class="tbl-wrap"><table class="tbl"><tr><th>Bill</th><th>Date</th><th>Due</th><th class="n">Amount</th><th class="n">Paid / adjusted</th><th class="n">Balance</th><th></th></tr>' + r.items.map(function (i) {

  $('spOk').onclick = function () {
    var v = formVals('spF');
    if (window._spHow === 'PICK') v.allocations = [].map.call(document.querySelectorAll('.spA'), function (i) { return { item_id: i.dataset.id, amount: Number(i.value) || 0 }; }).filter(function (a) { return a.amount > 0; });
    act(this, 'Saving…', function () { return readFile('spProof').then(function (f) { if (f) { v.proof_base64 = f.data; v.proof_file_name = f.name; v.proof_mime_type = f.mime; } return call('recordSupplierPayment', v); }); }).then(function () { closeModal(); refresh(); }, swallow);
  };
}
function spHow(b) { window._spHow = b.dataset.v; document.querySelectorAll('#spHow button').forEach(function (x) { x.classList.toggle('on', x === b); }); $('spPick').classList.toggle('hidden', b.dataset.v !== 'PICK'); if (b.dataset.v === 'PICK') spFill(); spLeft(); }
function spFill() {
  var left = Number(document.querySelector('#spF [name=amount]').value) || 0;
  document.querySelectorAll('.spA').forEach(function (i) { var a = Math.min(left, Number(i.dataset.max)); i.value = a > 0 ? a.toFixed(2) : ''; left = Math.round((left - a) * 100) / 100; });
}
function spLeft() {
  var amt = Number(document.querySelector('#spF [name=amount]').value) || 0, used = 0;
  if (window._spHow === 'PICK') document.querySelectorAll('.spA').forEach(function (i) { used += Number(i.value) || 0; });
  $('spLeftTxt').textContent = window._spHow === 'PICK' ? 'Adjusted ' + money(used) + ' · kept as advance ' + money(Math.max(0, amt - used)) : 'Oldest bills are adjusted first. Anything left is kept as advance and used for the next bill.';
}
function spAdjust(id) { act(null, '', function () { return call('adjustSupplierCredit', id, []); }).then(refresh, swallow); }
function spAdjustAll() { var ids = S.cache.pay.credits.map(function (c) { return c.id; }); (function next() { var id = ids.shift(); if (!id) return refresh(); call('adjustSupplierCredit', id, []).then(next, showErr); })(); }
function spCancel(id) { askReason('Cancel payment entry', null, { danger: true, okLabel: 'Cancel payment' }).then(function (x) { act(null, '', function () { return call('cancelSupplierPayment', id, x.reason); }).then(refresh, swallow); }); }
function spNoteForm() {
  var r = S.cache.pay;
  openModal('<h3>Note received from the company</h3><div class="form" id="snF"><div class="seg" id="snT"><button type="button" class="on" data-v="CREDIT" onclick="snT(this)">Credit note (reduces what you owe)</button><button type="button" data-v="DEBIT" onclick="snT(this)">Debit note (adds)</button></div>' +
    '<label class="field" style="margin-top:8px"><span>Supplier</span><input name="supplier_name" value="' + attr((S.params && S.params.supplier) || r.default_supplier) + '"></label>' +
    '<div class="grid2"><label class="field"><span>Their note no. <em>*</em></span><input name="note_number" style="text-transform:uppercase"></label><label class="field"><span>Note date <em>*</em></span><input type="date" name="note_date" max="' + today() + '" value="' + today() + '"></label></div>' +
    '<label class="field"><span>Reason <em>*</em></span><select name="reason">' + opts(L('SUPPLIER_NOTE'), '', 'Select reason') + '</select></label>' +
    '<div class="grid3"><label class="field"><span>Amount before GST ₹ <em>*</em></span><input name="taxable_value" type="number" step="0.01" oninput="snCalc()"></label><label class="field"><span>GST %</span><select name="gst_rate" onchange="snCalc()">' + opts([0, 5, 12, 18, 28, 40].map(function (g) { return { value: g, label: g + '%' }; }), 0) + '</select></label><label class="field"><span>Against bill (optional)</span><select name="purchase_id">' + opts(r.items.filter(function (i) { return i.kind === 'BILL'; }), '', 'Any / oldest', 'id', 'number') + '</select></label></div>' +
    '<label class="check"><input type="checkbox" id="snItc" checked> GST on this note affects input tax credit (GSTR-3B)</label><div class="note small" id="snTot" style="margin-top:6px"></div>' + fileField('snProof', 'Note copy (optional)') +
    '<label class="field"><span>Remarks</span><input name="remarks"></label><div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="snOk">Save note</button></div></div>');
  window._snT = 'CREDIT'; snCalc();
  $('snOk').onclick = function () {
    var v = formVals('snF'); v.note_type = window._snT; v.itc_effect = $('snItc').checked ? 'YES' : 'NO';
    act(this, 'Saving…', function () { return readFile('snProof').then(function (f) { if (f) { v.proof_base64 = f.data; v.proof_file_name = f.name; v.proof_mime_type = f.mime; } return call('recordSupplierNote', v); }); }).then(function () { closeModal(); refresh(); }, swallow);
  };
}
function snT(b) { window._snT = b.dataset.v; document.querySelectorAll('#snT button').forEach(function (x) { x.classList.toggle('on', x === b); }); }
function snCalc() { var t = Number(document.querySelector('#snF [name=taxable_value]').value) || 0, g = Number(document.querySelector('#snF [name=gst_rate]').value) || 0; $('snTot').textContent = 'Total ' + money(Math.round((t + t * g / 100) * 100) / 100) + ' (GST ' + money(t * g / 100) + ')'; }
function spLedger(supplier) {
  call('getSupplierLedger', supplier, '', today()).then(function (l) {
    openModal('<h3>Ledger – ' + esc(l.supplier) + '</h3><div class="small muted" style="margin-bottom:8px">Balance payable <b>' + money(l.closing) + '</b>' + (l.closing < 0 ? ' (advance with company)' : '') + '</div><div class="tbl-wrap" style="max-height:60vh;overflow:auto"><table class="tbl"><tr><th>Date</th><th>Entry</th><th>Ref</th><th class="n">Paid / credit</th><th class="n">Bill</th><th class="n">Balance</th></tr>' +
      l.rows.map(function (x) { return '<tr><td>' + fdate(x.date) + '</td><td>' + esc(x.type) + '</td><td>' + esc(x.ref) + '</td><td class="n">' + (x.debit ? money(x.debit) : '') + '</td><td class="n">' + (x.credit ? money(x.credit) : '') + '</td><td class="n">' + money(x.balance) + '</td></tr>'; }).join('') + '</table></div>' +
      '<div class="actions end" style="margin-top:10px"><button class="btn ghost" onclick="closeModal();go(\'report\',{id:\'supplier_ledger\'})">Excel</button><button class="btn" onclick="closeModal()">Close</button></div>');
  }, showErr);
}
</script>

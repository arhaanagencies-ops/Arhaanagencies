<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<script>
/* Talks to the Arhaan Apps Script server without Google sign-in (works on phones with several Google accounts). */
(function () {
  var URL_ = window.ARHAAN_API_URL || '';
  function post(fn, args) {
    if (!/^https?:\/\//.test(URL_)) return Promise.reject(new Error('App is not connected yet: put the web-app /exec link in config.js.'));
    return fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), redirect: 'follow', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('Server error ' + r.status); return r.text(); })
      .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('The server did not answer correctly. Check that the web app is deployed with access "Anyone".'); } });
  }
  function make(ok, fail) {
    return new Proxy({}, { get: function (t, name) {
      if (name === 'withSuccessHandler') return function (f) { return make(f, fail); };
      if (name === 'withFailureHandler') return function (f) { return make(ok, f); };
      return function () {
        var args = [].slice.call(arguments);
        post(name, args).then(function (r) { if (r.error) { if (fail) fail(new Error(r.error)); } else if (ok) ok(r.result); },
          function (e) { if (fail) fail(new Error(/connected|answer/.test(e.message) ? e.message : 'Cannot reach the server – check the internet and try again.')); });
      };
    } });
  }
  window.google = { script: { run: make(null, null) } };
})();
</script>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink-2:#3A4766; --muted:#6B7590; --line:#E2E6EE; --line-2:#EEF1F6;
  --paper:#F4F6F9; --surface:#FFFFFF; --blue:#1F4FD1; --blue-2:#E8EEFC; --blue-ink:#163A9E;
  --amber:#D9920F; --amber-2:#FDF3E0; --green:#1E8E5A; --green-2:#E5F4EC; --red:#C2412D; --red-2:#FBEAE6;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --header-h:58px; --strip-h:40px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:15px;line-height:1.45;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--blue)}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:18px} h3{font-size:16px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.hidden{display:none!important}
:focus-visible{outline:3px solid rgba(31,79,209,.35);outline-offset:2px}
@media (max-width:480px){.route .stop{font-size:10.5px}.route .stop i{width:18px;height:18px}.route .stop::before{top:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}
.login-card{width:min(400px,100%);background:var(--surface);border-radius:var(--r-l);padding:28px 24px}
.login-mark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.login-mark .logo{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
.login-mark b{display:block;font-size:19px}
.login-mark span{color:var(--muted);font-size:13px}
.login .route{display:flex;align-items:center;gap:6px;margin:0 0 22px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.login .route i{width:6px;height:6px;border-radius:50%;background:var(--blue);display:inline-block}

/* ---------- shell ---------- */
.header{position:sticky;top:0;z-index:30;height:var(--header-h);background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px}
.header .logo{width:36px;height:36px;border-radius:10px;background:#fff;color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;overflow:hidden}
.header .logo img{width:100%;height:100%;object-fit:cover}
.header .who{min-width:0;flex:1}
.header .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .who span{display:block;font-size:12px;color:#B9C3DB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:10px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.hbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;border-radius:10px;min-width:18px;height:18px;line-height:18px;padding:0 4px}
.clock{font-family:var(--font-num);font-size:13px;color:#B9C3DB;white-space:nowrap}
.strip{position:sticky;top:var(--header-h);z-index:25;height:var(--strip-h);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px}
.strip label{color:var(--muted);white-space:nowrap}
.strip select{width:auto;min-height:0;font-size:14px;border:0;background:var(--blue-2);color:var(--blue-ink);font:inherit;font-weight:600;border-radius:8px;padding:5px 8px;max-width:60vw}
.strip .busy{margin-left:auto;display:none;align-items:center;gap:6px;color:var(--blue-ink);background:var(--blue-2);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.strip .busy.on{display:inline-flex}
.spin{width:12px;height:12px;border:2px solid rgba(31,79,209,.25);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.layout{display:flex;min-height:calc(100vh - var(--header-h) - var(--strip-h))}
.side{display:none}
.main{flex:1;min-width:0;padding:14px 12px 96px;max-width:1100px;margin:0 auto;width:100%}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bottom button{flex:1;background:none;border:0;font:inherit;font-size:12px;color:var(--muted);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:10px}
.bottom button svg{width:22px;height:22px}
.bottom button.on{color:var(--blue);font-weight:600}
@media (min-width:900px){
  .bottom{display:none}
  .side{display:block;width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:12px 8px;position:sticky;top:calc(var(--header-h) + var(--strip-h));height:calc(100vh - var(--header-h) - var(--strip-h));overflow:auto}
  .main{padding:20px 24px 40px}
  .hide-desk{display:none!important}
}
@media (max-width:899px){.hide-mob{display:none!important}}
.nav-group{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;font:inherit;color:var(--ink-2);padding:9px 10px;border-radius:10px;cursor:pointer;text-align:left}
.nav-item svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav-item:hover{background:var(--paper)}
.nav-item.on{background:var(--blue-2);color:var(--blue-ink);font-weight:600}
.nav-item.on svg{color:var(--blue)}
.nav-item .count{margin-left:auto;background:var(--amber-2);color:#8A5A00;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px}

/* drawer (mobile "More") */
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(20,33,61,.45)}
.drawer .panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;padding:10px 8px calc(16px + env(safe-area-inset-bottom))}
.drawer .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 6px}

/* ---------- page ---------- */
.page-head{display:flex;align-items:flex-start;gap:10px;margin:2px 0 14px}
.page-head .t{flex:1;min-width:0}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.back svg{width:18px;height:18px}
.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:14px;margin-bottom:12px}
.section > h3{margin-bottom:10px}
.section-head{display:flex;align-items:center;gap:4px 8px;margin-bottom:10px;flex-wrap:wrap}
.section-head h3{white-space:nowrap}
.section-head h3{flex:1}
.flat{background:transparent;border:0;padding:0}

/* KPI tiles: left rule encodes meaning */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink-2);border-radius:var(--r-m);padding:10px 12px;cursor:default;text-align:left;font:inherit;color:inherit;width:100%}
button.kpi{cursor:pointer}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--font-num);font-size:23px;font-weight:600;line-height:1.15;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.sales{border-left-color:var(--green)} .kpi.order{border-left-color:var(--blue)} .kpi.cash{border-left-color:#2B8FA3} .kpi.due{border-left-color:var(--red)} .kpi.warn{border-left-color:var(--amber)}

/* attention list */
.attn{display:flex;flex-direction:column}
.attn button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--line-2);padding:11px 2px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.attn button:last-child{border-bottom:0}
.attn .n{font-family:var(--font-num);font-weight:600;font-size:18px;min-width:40px;height:34px;border-radius:9px;background:var(--amber-2);color:#8A5A00;display:grid;place-items:center;padding:0 6px}
.attn .x{flex:1}
.attn .x small{display:block;color:var(--muted)}

/* rows (lists) */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none}
.row .r b{font-family:var(--font-num);font-weight:600;display:block}
.row.static{cursor:default}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* status chips */
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.blue{background:var(--blue-2);color:var(--blue-ink)} .chip.green{background:var(--green-2);color:#13603C}
.chip.amber{background:var(--amber-2);color:#8A5A00} .chip.red{background:var(--red-2);color:#8E2A1B}

/* the order route: the one memorable element */
.route{display:flex;align-items:flex-start;margin:4px 0 2px;overflow-x:auto;padding-bottom:4px}
.route .stop{flex:1;min-width:0;position:relative;text-align:center;font-size:11.5px;color:var(--muted)}
.route .stop::before{content:'';position:absolute;top:9px;left:-50%;width:100%;height:3px;background:var(--line)}
.route .stop:first-child::before{display:none}
.route .stop i{position:relative;z-index:1;display:block;width:21px;height:21px;margin:0 auto 4px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.route .stop.done{color:var(--ink-2)}
.route .stop.done::before{background:var(--blue)}
.route .stop.done i{background:var(--blue);border-color:var(--blue)}
.route .stop.now{color:var(--blue-ink);font-weight:700}
.route .stop.now::before{background:var(--blue)}
.route .stop.now i{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-2)}
.route .stop.warn i{border-color:var(--amber);background:var(--amber)}
.route .stop.warn{color:#8A5A00;font-weight:700}
.route .stop.bad i{border-color:var(--red);background:var(--red)}
.route .stop.bad{color:var(--red);font-weight:700}
.mini-route{display:flex;gap:3px;margin-top:5px}
.mini-route i{height:4px;flex:1;border-radius:3px;background:var(--line)}
.mini-route i.d{background:var(--blue)} .mini-route i.w{background:var(--amber)} .mini-route i.b{background:var(--red)}

/* forms */
.form{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr 1fr 1fr}}
.grid3{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink-2)}
.field > span em{font-style:normal;color:var(--red)}
.field small{color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid #CFD5E1;border-radius:var(--r-s);padding:10px 11px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,79,209,.15)}
input[readonly]{background:var(--paper)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;min-height:0}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:5px;border:1px solid #CFD5E1;border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}
.days input{width:16px;height:16px;min-height:0}
.days label:has(input:checked){background:var(--blue-2);border-color:var(--blue);color:var(--blue-ink);font-weight:600}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;border:1px solid transparent;min-height:44px;padding:0 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--blue);color:#fff;white-space:nowrap}
.btn:hover{background:var(--blue-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:#CFD5E1}
.btn.ghost:hover{background:var(--paper)}
.btn.quiet{background:var(--blue-2);color:var(--blue-ink)}
.btn.danger{background:var(--surface);color:var(--red);border-color:#E9B9AF}
.btn.ok{background:var(--green)}
.btn.sm{min-height:34px;padding:0 11px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions.end{justify-content:flex-end}
.sticky-actions{position:sticky;bottom:72px;background:linear-gradient(to top,var(--paper) 70%,transparent);padding:10px 0 4px;display:flex;gap:8px;z-index:5}
@media (min-width:900px){.sticky-actions{bottom:0}}
.note{border-radius:var(--r-m);padding:10px 12px;font-size:14px;background:var(--blue-2);color:var(--blue-ink)}
.note.warn{background:var(--amber-2);color:#7A4F00}
.note.bad{background:var(--red-2);color:#8E2A1B}
.note.good{background:var(--green-2);color:#13603C}
.tabs{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;background:none;border:0;font:inherit;font-size:14px;padding:8px 12px;border-radius:9px;color:var(--ink-2);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
@media (min-width:800px){.filters{grid-template-columns:repeat(4,1fr)}}
.filters .wide{grid-column:1/-1}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:13px;width:18px;height:18px;color:var(--muted)}

/* order lines */
.line{border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px;background:var(--surface)}
.line .top{display:flex;gap:8px;align-items:flex-start}
.line .top b{flex:1}
.line .meta{font-size:13px;color:var(--muted)}
.line.low{border-color:#F0C98A;background:#FFFBF2}
.qtybox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.total-bar{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border-radius:var(--r-m);padding:12px 14px;margin:10px 0}
.total-bar .v{font-family:var(--font-num);font-size:22px;font-weight:600;margin-left:auto}
.picker{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
.picker .row{padding:10px 12px}
.picker .row.sel{background:var(--blue-2)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal button{min-height:50px;border-radius:9px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:14px;color:#A3ABBF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;cursor:not-allowed}
.cal button small{font-size:9.5px;line-height:1.1}
.cal button.ok{background:var(--surface);color:var(--ink);border-color:#B9CBF5;cursor:pointer;font-weight:600}
.cal button.ok small{color:var(--green)}
.cal button.sel{background:var(--blue);border-color:var(--blue);color:#fff}
.cal button.sel small{color:#DCE5FF}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head b{flex:1;text-align:center}

/* tables (desktop-friendly, scroll on mobile) */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:var(--r-m)}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--paper)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--font-num)}
.tbl tr:last-child td{border-bottom:0}
.tbl input{min-height:36px;padding:6px 8px;font-size:15px;width:90px}
.tbl select{min-height:36px;padding:6px 8px;font-size:14px}

/* timeline */
.tl{position:relative;padding-left:18px}
.tl::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl div{position:relative;padding:4px 0 10px}
.tl div::before{content:'';position:absolute;left:-17px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--blue)}
.tl b{font-weight:600}
.tl small{display:block;color:var(--muted)}

.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* modal sheet */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(20,33,61,.45)}
.modal.open{display:flex}
.modal .sheet{background:var(--surface);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:var(--r-l)}}
.modal .sheet h3{margin-bottom:12px}

/* toast */
.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,20px);z-index:80;background:var(--ink);color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(20,33,61,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.bad{background:var(--red)}
.toast.good{background:#13603C}
@media (min-width:900px){.toast{bottom:28px}}
.photo-in{display:flex;align-items:center;gap:10px;border:1px dashed #B9C3DB;border-radius:var(--r-s);padding:10px;background:var(--paper)}
.photo-in input{border:0;padding:0;min-height:0;background:transparent;font-size:14px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--blue);cursor:pointer;text-decoration:underline}

/* ---------- GST documents (screen preview + print) ---------- */
#printArea{display:none}
.doc{font-family:Arial,Helvetica,sans-serif;font-size:8.6pt;line-height:1.3;color:#000;background:#fff;padding:2mm 3mm;width:194mm;box-sizing:border-box}
.doc .doc-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.5mm}
.doc .doc-title{font-size:12pt;font-weight:700;letter-spacing:.06em}
.doc .doc-copy{font-size:7.5pt}
.doc .doc-seller{font-size:11pt;font-weight:700}
.doc .doc-seller span{font-size:8.6pt;font-weight:400}
.doc table{width:100%;border-collapse:collapse}
.doc .dt > tbody > tr > td,.doc .dt > tr > td{border:.6pt solid #222;padding:1.2mm 1.6mm;vertical-align:top}
.doc .di{margin-top:1.5mm}
.doc .di th,.doc .di td{border:.6pt solid #222;padding:.9mm 1.2mm;text-align:left}
.doc .di th{background:#eee;font-weight:700}
.doc .di tr.tot td{font-weight:700;background:#f5f5f5}
.doc .dm td{border:0;padding:.3mm 0}
.doc .dm td:first-child{color:#333;padding-right:2mm;white-space:nowrap}
.doc .dm tr.grand td{font-weight:700;font-size:10pt;border-top:.6pt solid #222;padding-top:.8mm}
.doc .dx th,.doc .dx td{border:.6pt solid #888;padding:.5mm 1mm}
.doc .n,.doc .di th.n,.doc .di td.n,.doc .dx th.n,.doc .dx td.n{text-align:right;white-space:nowrap}
.doc .doc-words{margin-top:1.2mm;font-weight:700}
.doc .doc-terms{font-size:7pt}
.doc .doc-sign{text-align:right}
.doc .doc-foot{font-size:6.5pt;color:#444;margin-top:1mm;text-align:right}
.doc-cut{border-top:1px dashed #999;margin:3mm 0 0;font-size:6.5pt;color:#999;text-align:center;width:194mm}
@media print {
  html,body{background:#fff!important}
  body > *:not(#printArea):not(style):not(script){display:none!important}
  #printArea{display:block!important}
  .doc{padding:0}
}
/* ---------- V7.3 brand logo ---------- */
.header .logo img,.login-mark .logo img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.login-mark .brand-logo{background:#fff;border:1px solid var(--line);width:60px;height:60px;overflow:hidden;flex:none}
.doc .doc-logo{float:left;height:38px;width:auto;margin:0 8px 2px 0}
/* ---------- V7.2 home delivery ---------- */
.seg{display:flex;gap:4px;background:var(--line-2);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:10px 6px;border-radius:9px;color:var(--ink-2);cursor:pointer;min-height:44px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:44px;min-height:44px;border:0;background:var(--line-2);font-size:20px;font-weight:600;color:var(--ink);cursor:pointer}
.stepper input{width:56px;border:0;text-align:center;font-family:var(--font-num);font-size:17px;font-weight:600;min-height:44px;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qr-box{display:inline-block;width:min(240px,70vw);padding:8px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-box svg{width:100%;height:auto;display:block}
</style>

.paybox{text-align:center}

.gate-logo{width:56px;height:56px;border-radius:14px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;padding:4px}

<script>
/* =====================================================================
   Customer ordering page (home delivery). The browser only renders –
   every rule (cut-off, prices, approval, ownership) is checked on the server.
   ===================================================================== */
var S = { token: '', boot: null, view: 'order', params: {}, cache: {}, cart: {}, date: '' };
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function attr(v) { return esc(v); }
function js(v) { return esc(JSON.stringify(v == null ? '' : v)); }
function money(v) { return '₹' + Number(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function money0(v) { return '₹' + Number(v || 0).toLocaleString('en-IN', { maximumFractionDigits: 0 }); }
function num(v) { return Number(v || 0).toLocaleString('en-IN'); }
function cap(v) { v = String(v || '').replace(/_/g, ' ').toLowerCase(); return v.charAt(0).toUpperCase() + v.slice(1); }
function addDays(key, n) { var d = new Date(key + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fdate(v) { var s = String(v || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return v ? esc(v) : '–'; return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }); }
function fday(k) { return new Date(k + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short' }); }
function fdatetime(v) { var s = String(v || ''); return s.length > 10 ? fdate(s) + ' ' + s.slice(11, 16) : fdate(s); }
function val(id) { var el = $(id); return el ? el.value : ''; }
function opts(list, sel, ph, vk, lk) { var h = ph !== undefined ? '<option value="">' + esc(ph) + '</option>' : ''; (list || []).forEach(function (x) { var v = typeof x === 'object' ? x[vk || 'value'] : x, l = typeof x === 'object' ? x[lk || 'label'] : x; h += '<option value="' + attr(v) + '"' + (String(v) === String(sel == null ? '' : sel) ? ' selected' : '') + '>' + esc(l) + '</option>'; }); return h; }
var toastT = null;
function toast(msg, type) { var t = $('toast'); t.textContent = msg; t.className = 'toast show' + (type ? ' ' + type : ''); clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, 5000); }
function showErr(e) { toast((e && e.message) || String(e), 'bad'); }
function swallow() {}
function openModal(h) { $('sheet').innerHTML = h; $('modal').classList.add('open'); }
function closeModal() { $('modal').classList.remove('open'); $('sheet').innerHTML = ''; }
function chip(s, label) { var t = { PLACED: 'blue', CONFIRMED: 'blue', DELIVERED: 'green', PARTIAL: 'amber', NOT_DELIVERED: 'red', CANCELLED: 'red', PAID: 'green', VERIFYING: 'amber', PART: 'amber', UNPAID: 'red', PENDING: 'amber', VERIFIED: 'green', REJECTED: 'red', ACTIVE: 'green', PAUSED: 'amber', ENDING: 'amber' }[s] || ''; return '<span class="chip ' + t + '">' + esc(label || cap(s)) + '</span>'; }
var ST = { PLACED: 'Ordered', CONFIRMED: 'Confirmed', DELIVERED: 'Delivered', PARTIAL: 'Part delivered', NOT_DELIVERED: 'Not delivered', CANCELLED: 'Cancelled' };
var PAYST = { PAID: 'Paid', VERIFYING: 'Payment being checked', PART: 'Part paid', UNPAID: 'Not paid' };

function rpc(fn, args) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(String((e && e.message) || e).replace(/^(Error|Exception):\s*/, ''))); })[fn].apply(null, args || []);
  });
}
function call(method) {
  var args = [].slice.call(arguments, 1);
  return rpc('callShop', [method, args, S.token]).catch(function (e) { if (/login again/i.test(e.message)) { storeToken(''); showGate('login', e.message); } throw e; });
}
function act(btn, label, fn) {
  var old = btn ? btn.innerHTML : '';
  if (btn) { if (btn.disabled) return Promise.resolve(); btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + esc(label); }
  return Promise.resolve().then(fn).then(function (r) { if (btn) { btn.disabled = false; btn.innerHTML = old; } if (r && r.message) toast(r.message, 'good'); return r; },
    function (e) { if (btn) { btn.disabled = false; btn.innerHTML = old; } showErr(e); throw e; });
}
function readFile(id) {
  var f = $(id) && $(id).files && $(id).files[0];
  if (!f) return Promise.resolve(null);
  return new Promise(function (resolve, reject) {
    if (f.size > 12 * 1024 * 1024) return reject(new Error('File is larger than 12 MB.'));
    var r = new FileReader();
    r.onerror = function () { reject(new Error('Could not read the file.')); };
    r.onload = function () {
      if (!/^image\//.test(f.type)) return resolve({ data: r.result, name: f.name, mime: f.type });
      var img = new Image();
      img.onload = function () { var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve({ data: c.toDataURL('image/jpeg', 0.8), name: 'screenshot.jpg', mime: 'image/jpeg' }); };
      img.onerror = function () { resolve({ data: r.result, name: f.name, mime: f.type }); };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  });
}
function storeToken(t) { S.token = t || ''; try { if (t) localStorage.setItem('arhaan_shop_token', t); else localStorage.removeItem('arhaan_shop_token'); } catch (e) {} }

/* ------------------------------ login / register ------------------------------ */
var PUB = null;
function showGate(mode, msg) {
  $('app').classList.add('hidden'); $('gate').classList.remove('hidden');
  var draw = function () {
    var h = '<div class="login-mark"><div class="gate-logo"><img alt="" src="' + APP_LOGO + '"></div><div><b>' + esc(PUB.shop_name) + '</b><span>Order by ' + esc(PUB.cutoff) + ' for delivery ' + (PUB.before === 1 ? 'next morning' : 'in ' + PUB.before + ' days') + '</span></div></div>';
    if (mode === 'register') {
      h += '<div class="form" id="rg"><label class="field"><span>Your name <em>*</em></span><input name="name" autocomplete="name"></label><label class="field"><span>Mobile number <em>*</em></span><input name="mobile" inputmode="tel" autocomplete="tel"></label>' +
        '<label class="field"><span>Community / apartment <em>*</em></span><select name="community_id" onchange="rgTowers()">' + opts(PUB.communities, '', 'Select', 'community_id', 'name') + '</select></label>' +
        '<div class="grid2"><label class="field"><span>Tower / wing</span><span id="rgT"><input name="tower"></span></label><label class="field"><span>Flat / villa no. <em>*</em></span><input name="flat"></label></div>' +
        '<label class="field"><span>Landmark / delivery note</span><input name="landmark" placeholder="e.g. leave at door, 2nd floor"></label>' +
        '<div class="grid2"><label class="field"><span>Choose a PIN (4–6 digits) <em>*</em></span><input name="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label><label class="field"><span>Repeat PIN <em>*</em></span><input name="pin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password"></label></div>' +
        '<button class="btn block" id="rgBtn" onclick="doRegister()">Register</button><div class="small" style="text-align:center"><a href="#" onclick="event.preventDefault();showGate(\'login\')">Already registered? Login</a></div></div>';
    } else {
      h += '<form class="form" onsubmit="event.preventDefault();doLogin()"><label class="field"><span>Mobile number</span><input id="lm" inputmode="tel" autocomplete="tel" required></label><label class="field"><span>PIN</span><input id="lp" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" required></label>' +
        '<button class="btn block" id="lgBtn" type="submit">Login</button><div class="small" style="text-align:center"><a href="#" onclick="event.preventDefault();showGate(\'register\')">New here? Register</a></div>' +
        '<div class="tiny muted" style="text-align:center">Forgot PIN? ' + (PUB.support_phone ? 'Call <a href="tel:' + attr(PUB.support_phone) + '">' + esc(PUB.support_phone) + '</a>' : 'Contact us') + ' to reset it.</div></form>';
    }
    h += '<div id="gMsg" class="small" style="margin-top:10px;color:var(--red)">' + esc(msg || '') + '</div>';
    $('gateCard').innerHTML = h;
  };
  if (PUB) draw(); else rpc('shopPublicInfo').then(function (p) { PUB = p; draw(); }, function (e) { $('gateCard').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
}
function rgTowers() {
  var c = PUB.communities.filter(function (x) { return x.community_id === document.querySelector('#rg [name=community_id]').value; })[0];
  $('rgT').innerHTML = c && c.towers.length ? '<select name="tower">' + opts(c.towers, '', 'Select') + '</select>' : '<input name="tower">';
}
function formOf(id) { var o = {}; document.querySelectorAll('#' + id + ' [name]').forEach(function (i) { o[i.name] = i.value.trim(); }); return o; }
function doRegister() {
  var v = formOf('rg'); v.device = navigator.userAgent;
  act($('rgBtn'), 'Registering…', function () { return rpc('shopRegister', [v]); }).then(function (r) { storeToken(r.token); start(); }, function (e) { $('gMsg').textContent = e.message; });
}
function doLogin() {
  act($('lgBtn'), 'Logging in…', function () { return rpc('shopLogin', [val('lm'), val('lp'), navigator.userAgent]); }).then(function (r) { storeToken(r.token); start(); }, function (e) { $('gMsg').textContent = e.message; });
}
function logout() { var t = S.token; storeToken(''); $('toast').className = 'toast'; rpc('shopLogout', [t]).catch(swallow); S.boot = null; showGate('login'); }

/* ------------------------------ shell ------------------------------ */
var TABS = [['order', 'Order', 'M6 6h15l-1.5 9h-12zM6 6 5 3H2M9 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2M18 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2'], ['calendar', 'Calendar', 'M8 2v4M16 2v4M3 9h18M5 5h14v16H5z'],
  ['subs', 'Daily plan', 'M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4'], ['orders', 'My orders', 'M4 5h16M4 12h16M4 19h10'], ['pay', 'Pay', 'M2 7h20v10H2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6']];
function start() {
  call('shopBoot').then(function (b) {
    S.boot = b; $('gate').classList.add('hidden'); $('app').classList.remove('hidden');
    $('sLogo').innerHTML = '<img alt="" src="' + APP_LOGO + '">'; $('sName').textContent = b.shop.name; $('sUser').textContent = b.customer.name + ' · ' + [b.customer.flat, b.customer.tower].filter(Boolean).join(' / ') + ' · ' + b.customer.community;
    if (!S.date) S.date = b.first_date;
    paintNav(); go(S.view || 'order', S.params);
  }, function (e) { if (!/login again/i.test(e.message)) showGate('login', e.message); });
}
function paintNav() {
  var due = S.boot.dues.reduce(function (a, d) { return a + d.due; }, 0);

/* ------------------------------ PAY ------------------------------ */
VIEWS.pay = function () {
  call('shopDues').then(function (r) {
    S.cache.dues = r;
    var h = head('Pay', 'Pay by UPI, then send us the payment screenshot');
    if (!r.companies.length) h += '<div class="empty"><b>Nothing to pay</b>Your bills appear here after delivery.</div>';
    r.companies.forEach(function (c, i) {
      h += '<div class="section paybox"><div class="small muted">' + esc(c.company_name) + '</div><div class="amt">' + money(c.due) + '</div><div class="small">' + (c.due > 0 ? 'due for ' + num(c.unpaid.length) + ' deliver' + (c.unpaid.length === 1 ? 'y' : 'ies') : (c.advance ? 'You have ' + money(c.advance) + ' advance' : 'All paid ✓')) + (c.pending ? ' · ' + money(c.pending) + ' being checked' : '') + '</div>';
      if (c.due > 0) {
        h += (r.upi_id ? '<div class="actions" style="justify-content:center;margin-top:12px"><a class="btn" href="' + attr(upiLink(r.upi_id, r.upi_name, c.due, 'Dues ' + S.boot.customer.flat)) + '">Pay ' + money(c.due) + ' with UPI app</a></div><div class="tiny muted" style="margin-top:6px">or scan from another phone:</div><div id="qr' + i + '" style="margin-top:6px"></div><div class="small">UPI ID: <b>' + esc(r.upi_id) + '</b> · ' + esc(r.upi_name) + '</div>' : '<div class="note warn small">UPI payment details are not set up yet – please pay at delivery.</div>');
        h += '<details style="margin-top:10px;text-align:left"><summary class="small">Bills not yet paid</summary>' + c.unpaid.map(function (u) { return '<div class="small" style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line-2)"><span>' + fdate(u.date) + ' · ' + esc(u.invoice_number) + '</span><b>' + money(u.amount) + '</b></div>'; }).join('') + '</details>';
      }
      h += '<div class="actions" style="justify-content:center;margin-top:12px"><button class="btn ghost" onclick="paidForm(' + i + ')">I have paid – send screenshot</button></div></div>';
    });
    if (r.payments.length) h += '<div class="section"><h3>My payments</h3><div class="rows">' + r.payments.map(function (p) { return '<div class="row static"><div class="m"><b>' + esc(p.mode) + ' ' + money(p.amount) + '</b><span>' + fdate(p.payment_date) + (p.utr ? ' · ref ' + esc(p.utr) : '') + (p.reject_reason ? ' · ' + esc(p.reject_reason) : '') + '</span></div><div class="r">' + chip(p.status, { PENDING: 'Being checked', VERIFIED: 'Received ✓', REJECTED: 'Not received' }[p.status]) + '</div></div>'; }).join('') + '</div></div>';
    $('main').innerHTML = h;
    r.companies.forEach(function (c, i) { if (c.due > 0 && r.upi_id) drawUpiQr('qr' + i, r.upi_id, r.upi_name, c.due, 'Dues ' + S.boot.customer.flat); });
  }, function (e) { $('main').innerHTML = '<div class="note bad">' + esc(e.message) + '</div>'; });
};
function paidForm(i) {
  var c = S.cache.dues.companies[i];
  openModal('<h3>Send payment proof</h3><div class="form" id="pf"><label class="field"><span>Amount paid ₹ <em>*</em></span><input id="pfA" type="number" step="0.01" inputmode="decimal" value="' + (c.due > 0 ? c.due : '') + '"></label>' +
    '<label class="field"><span>UPI reference / UTR no. <em>*</em></span><input id="pfU" inputmode="numeric" placeholder="12-digit number on the payment screen"></label>' +
    '<div class="field"><span>Payment screenshot' + (S.cache.dues.proof_required ? ' <em>*</em>' : '') + '</span><div class="photo-in"><input type="file" id="pfS" accept="image/*"></div></div>' +
    '<div class="actions end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="pfOk">Send</button></div></div>');
  $('pfOk').onclick = function () {
    var btn = this;
    act(btn, 'Sending…', function () { return readFile('pfS').then(function (f) { return call('shopPay', { company_id: c.company_id, amount: Number(val('pfA')), utr: val('pfU'), proof_base64: f ? f.data : '', proof_file_name: f ? f.name : '', proof_mime_type: f ? f.mime : '' }); }); })
      .then(function () { closeModal(); refreshBoot().then(function () { go('pay'); }); }, swallow);
  };
}

    (d.extra || []).map(function (x) { return '<tr><td>' + esc(x[0]) + '</td><td>' + esc(x[1]) + '</td></tr>'; }).join('') +

  return '<div class="doc ' + (d.layout === 'HALF' ? 'half' : 'full') + '"><div class="doc-top"><div class="doc-title">' + esc(d.title) + (d.status === 'CANCELLED' ? ' – CANCELLED' : '') + '</div><div class="doc-copy">' + esc(d.copy_label) + '</div></div>' +

    (d.principal ? '<br>Distributor for ' + esc(d.principal) : '') + '</td><td><table class="dm">' + meta + '</table></td></tr>' +

    '<table class="dt di"><tr><th>#</th><th>Product</th><th>HSN</th><th class="n">Qty</th><th class="n">Rate incl. GST</th><th class="n">GST</th><th class="n">Taxable</th><th class="n">Tax</th><th class="n">Amount</th></tr>' + rows +
    '<tr class="tot"><td></td><td>Total</td><td></td><td class="n">' + num(d.total_qty) + '</td><td></td><td></td><td class="n">' + m2(d.taxable_value) + '</td><td class="n">' + m2(d.cgst + d.sgst + d.igst) + '</td><td class="n">' + m2(d.taxable_value + d.cgst + d.sgst + d.igst) + '</td></tr></table>' +

    '<td><table class="dm"><tr><td>Taxable value</td><td class="n">' + m2(d.taxable_value) + '</td></tr>' + (inter ? '<tr><td>IGST</td><td class="n">' + m2(d.igst) + '</td></tr>' : '<tr><td>CGST</td><td class="n">' + m2(d.cgst) + '</td></tr><tr><td>SGST</td><td class="n">' + m2(d.sgst) + '</td></tr>') +

    '<tr><td>' + (s.bank_name ? 'Bank: ' + esc(s.bank_name) + ' · A/c ' + esc(s.bank_account) + ' · IFSC ' + esc(s.bank_ifsc) + (s.upi_id ? ' · UPI ' + esc(s.upi_id) : '') + '<br>' : '') + '<span class="doc-terms">' + esc(s.invoice_terms) + ' Reverse charge: No.</span></td><td class="doc-sign">For ' + esc(s.seller_legal_name) + '<br><br><br>Authorised signatory</td></tr></table>' +

<script>
/* Shared by the staff app (delivery screen) and the customer page: UPI payment QR with the exact amount. */
var QR_LIB_URLS = ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'];
function loadQrLib() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (window._qrLoading) return window._qrLoading;
  window._qrLoading = new Promise(function (resolve, reject) {
    var i = 0;
    (function next() {
      if (i >= QR_LIB_URLS.length) { window._qrLoading = null; return reject(new Error('QR code could not load (no internet?). Ask the customer to pay to the UPI ID shown.')); }
      var s = document.createElement('script'); s.src = QR_LIB_URLS[i++];
      s.onload = function () { window.qrcode ? resolve(window.qrcode) : next(); };
      s.onerror = next;
      document.head.appendChild(s);
    })();
  });
  return window._qrLoading;
}
/** upi://pay link – opens GPay / PhonePe / Paytm with payee, amount and a note (invoice number) filled in. */
function upiLink(vpa, name, amount, note) {
  var q = ['pa=' + encodeURIComponent(vpa), 'pn=' + encodeURIComponent(name || ''), 'cu=INR'];
  if (Number(amount) > 0) q.push('am=' + Number(amount).toFixed(2));
  if (note) q.push('tn=' + encodeURIComponent(String(note).slice(0, 60)));
  return 'upi://pay?' + q.join('&');
}
/** Draws the QR into the element with the given id. */
function drawUpiQr(elId, vpa, name, amount, note) {
  var el = document.getElementById(elId);
  if (!el) return;
  if (!vpa) { el.innerHTML = '<div class="note warn small">UPI ID is not set. Admin → Direct (D2C) → Settings.</div>'; return; }
  el.innerHTML = '<div class="small muted">Loading QR…</div>';
  loadQrLib().then(function (qrcode) {
    var q = qrcode(0, 'M'); q.addData(upiLink(vpa, name, amount, note)); q.make();
    el.innerHTML = '<div class="qr-box">' + q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }) + '</div>';
  }, function (e) { el.innerHTML = '<div class="note warn small">' + esc(e.message) + '</div>'; });
}
</script>
